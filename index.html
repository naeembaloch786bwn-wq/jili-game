<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALEEM ELITE PRO</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #0b0e18; --card: #1c2230; --green: #24d15d; }
        body { font-family: 'Arial', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; }
        .header { background: var(--card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .balance-box { background: #000; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; font-size: 18px; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; margin-bottom: 70px; }
        .game-card { background: var(--card); border-radius: 15px; border: 1px solid #333; overflow: hidden; position: relative; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .game-card:active { transform: scale(0.95); }
        .game-card i { font-size: 30px; margin-bottom: 5px; }
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-dep { background: var(--gold); color: #000; }
        .btn-wit { background: var(--green); color: #fff; }
        
        /* Modal System */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 15px; width: 85%; max-width: 400px; border: 1px solid var(--gold); text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #000; color: white; }
        
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h1 style="color:var(--gold)">SALEEM ELITE</h1>
        <input type="email" id="email" placeholder="Gmail Address">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn btn-dep" style="width: 80%;" onclick="authAction('login')">LOGIN</button>
        <button class="btn" style="background:transparent; color:white; margin-top:10px;" onclick="authAction('reg')">REGISTER</button>
    </div>

    <div class="header">
        <div id="u-name" style="font-size: 14px; color: #aaa;">User</div>
        <div class="balance-box">PKR <span id="u-balance">0.00</span></div>
        <button onclick="logout()" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">Exit</button>
    </div>

    <div class="game-grid">
        <div class="game-card" onclick="playGame('Crash')">🚀<br>CRASH</div>
        <div class="game-card" onclick="playGame('Slots')">🎰<br>SLOTS</div>
        <div class="game-card" onclick="playGame('DragonTiger')">🐉<br>DRAGON TIGER</div>
        <div class="game-card" onclick="playGame('Mines')">💣<br>MINES</div>
    </div>

    <div id="walletModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color:var(--gold)">Deposit</h2>
            <input type="number" id="walletAmount" placeholder="Enter Amount">
            <input type="text" id="walletPhone" placeholder="Easypaisa/JazzCash Number">
            <button class="btn btn-dep" onclick="submitWallet()">SUBMIT</button>
            <button class="btn" onclick="closeModal()" style="background:grey; margin-top:5px;">Close</button>
        </div>
    </div>

    <div class="footer-nav">
        <button class="btn btn-dep" onclick="openModal('Deposit')">DEPOSIT</button>
        <button class="btn btn-wit" onclick="openModal('Withdraw')">WITHDRAW</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-a-eO1LKw1fUixVSjDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.firebasestorage.app",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e641fc2e337"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // 1. Auth System
    function authAction(type) {
        const em = document.getElementById('email').value;
        const ps = document.getElementById('pass').value;
        if(type === 'reg') {
            auth.createUserWithEmailAndPassword(em, ps).then(u => {
                db.ref('users/'+u.user.uid).set({ email: em, balance: 120.00 });
                alert("120 PKR Bonus Added!");
            }).catch(e => alert(e.message));
        } else {
            auth.signInWithEmailAndPassword(em, ps).catch(e => alert(e.message));
        }
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            db.ref('users/'+user.uid).on('value', s => {
                const d = s.val();
                document.getElementById('u-balance').innerText = d.balance.toFixed(2);
                document.getElementById('u-name').innerText = d.email.split('@')[0];
            });
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    function logout() { auth.signOut(); }

    // 2. Wallet System (Deposit/Withdraw)
    let currentMode = "";
    function openModal(mode) {
        currentMode = mode;
        document.getElementById('modalTitle').innerText = mode;
        document.getElementById('walletModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('walletModal').style.display = 'none'; }

    function submitWallet() {
        const amt = document.getElementById('walletAmount').value;
        const ph = document.getElementById('walletPhone').value;
        if(!amt || !ph) return alert("Fill all details");
        
        db.ref('requests').push({
            uid: auth.currentUser.uid,
            email: auth.currentUser.email,
            amount: amt,
            phone: ph,
            type: currentMode,
            status: "Pending"
        });
        alert(currentMode + " request sent to Saleem Admin!");
        closeModal();
    }

    // 3. Game Launch Fix
    function playGame(name) {
        // Ab hum alert nahi denge balki real function call karenge
        if(name === 'Crash') {
            alert("Crash Loading... (Redirecting to your crash.html)");
            window.location.href = "crash.html"; // Make sure crash.html exists on GitHub
        } else {
            alert(name + " Game logic starting... Ensure you have " + name.toLowerCase() + ".html on GitHub.");
        }
    }
</script>
</body>
</html>
