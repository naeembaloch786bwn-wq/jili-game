<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - NAEEM PRO ENGINE</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; }
        header { background: #111; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .bal-box { border: 1.5px solid var(--gold); padding: 5px 10px; border-radius: 5px; }

        /* Auth Screen Styling */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-box { background: #1a1a1a; padding: 25px; border-radius: 10px; width: 85%; border: 1px solid var(--gold); text-align: center; }
        
        /* Game Arena & UI */
        #game-content { display: none; } /* Chupaya hua hai jab tak login na ho */
        #game-arena { width: 92%; height: 240px; margin: 10px auto; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .history-bar { width: 92%; overflow-x: auto; margin: 5px auto; white-space: nowrap; height: 40px; }
        .h-item { display: inline-block; padding: 5px 10px; margin: 2px; border-radius: 3px; font-weight: bold; }

        .main-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 92%; margin: 10px auto; }
        .nav-btn { background: #1a1a1a; border-bottom: 2px solid var(--gold); padding: 12px; text-align: center; cursor: pointer; font-size: 14px; }

        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; box-sizing: border-box; border-top: 1px solid #333; }
        .btn-play { background: var(--gold); color: black; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .form-box { background: #1a1a1a; margin: 15px; padding: 20px; border-radius: 10px; width: 85%; border: 1px solid var(--gold); }
        input, select { background: #000; border: 1px solid #333; color: white; padding: 12px; width: 100%; margin-bottom: 10px; box-sizing: border-box; border-radius: 5px; }
        
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 40px; height: 40px; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <h1 style="color: var(--gold); margin-bottom: 20px;">NAEEM PRO ENGINE</h1>
    <div class="auth-box">
        <h2 id="auth-title">LOGIN</h2>
        <input type="email" id="auth-email" placeholder="Email Address">
        <input type="password" id="auth-pass" placeholder="Password">
        <button id="auth-btn" class="btn-play">LOGIN NOW</button>
        <p style="font-size: 12px; margin-top: 15px;" id="auth-toggle">Don't have an account? <span style="color: var(--gold); cursor: pointer;">Register</span></p>
    </div>
</div>

<div id="game-content">
    <header>
        <div style="font-weight: 900; color: var(--gold);">NAEEM PRO</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="bal-box">PKR <span id="wallet">150</span></div>
            <button onclick="logout()" style="background: red; color: white; border: none; border-radius: 5px; padding: 5px 10px; font-size: 10px;">LOGOUT</button>
        </div>
    </header>

    <div id="game-arena">
        <div id="display-area"><h2>CHOOSE GAME</h2></div>
    </div>

    <div class="history-bar" id="hist-row"></div>

    <div class="main-nav">
        <div class="nav-btn" onclick="setRoom('CRASH')">CRASH</div>
        <div class="nav-btn" onclick="setRoom('MINES')">MINES</div>
        <div class="nav-btn" onclick="setRoom('DVT')">DVT</div>
    </div>

    <div class="controls">
        <div id="dvt-choice" style="display:none; gap: 10px; margin-bottom: 10px; justify-content: center;">
            <button class="btn-play" style="background: #e74c3c; width: 45%; color: white;" onclick="selectSide('Dragon')">Dragon</button>
            <button class="btn-play" style="background: #3498db; width: 45%; color: white;" onclick="selectSide('Tiger')">Tiger</button>
        </div>
        <input type="number" id="bet-input" value="10">
        <button id="btn-play" class="btn-play" onclick="startPlay()">START PLAY</button>
        <button id="btn-cashout" class="btn-play" style="display:none; background: #2ecc71;" onclick="cashOutNow()">CASH OUT</button>

        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="btn-play" style="font-size: 10px; padding: 8px;" onclick="showPage('dep-page')">DEPOSIT</button>
            <button class="btn-play" style="font-size: 10px; padding: 8px;" onclick="showPage('wit-page')">WITHDRAW</button>
        </div>
    </div>
</div>

<div id="dep-page" class="page">
    <div class="form-box">
        <h2>DEPOSIT</h2>
        <p>JazzCash: <b>03289230760</b></p>
        <input type="number" id="d-amt" placeholder="Amount">
        <button class="btn-play" onclick="alert('Submitted!'); hidePages();">SUBMIT</button>
        <button onclick="hidePages()" style="background:none; border:none; color:white; margin-top:10px; width:100%;">BACK</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDTNneivrTLe-a-eO1LKw1fUixVSjDfu2k",
    authDomain: "pattipro-c1ffe.firebaseapp.com",
    projectId: "pattipro-c1ffe",
    appId: "1:766843054614:web:781658832e63e41fc2e337"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const authBtn = document.getElementById('auth-btn');
  const toggleBtn = document.getElementById('auth-toggle');
  let isLoginMode = true;

  // Toggle Login/Register
  toggleBtn.onclick = () => {
    isLoginMode = !isLoginMode;
    document.getElementById('auth-title').innerText = isLoginMode ? "LOGIN" : "REGISTER";
    authBtn.innerText = isLoginMode ? "LOGIN NOW" : "REGISTER NOW";
    toggleBtn.innerHTML = isLoginMode ? "Don't have an account? <span style='color:var(--gold)'>Register</span>" : "Already have an account? <span style='color:var(--gold)'>Login</span>";
  };

  // Auth Action
  authBtn.onclick = async () => {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    try {
        if (isLoginMode) {
            await signInWithEmailAndPassword(auth, email, pass);
        } else {
            await createUserWithEmailAndPassword(auth, email, pass);
            alert("Account Created!");
        }
    } catch (e) { alert(e.message); }
  };

  // Check User Session
  onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('auth-screen').style.display = "none";
        document.getElementById('game-content').style.display = "block";
    } else {
        document.getElementById('auth-screen').style.display = "flex";
        document.getElementById('game-content').style.display = "none";
    }
  });

  window.logout = () => signOut(auth);
</script>

<script>
    // Game Logic (Same as your previous screenshots)
    let wallet = 150.0;
    let room = "";
    let isPlaying = false;
    let bet = 0;
    let mult = 1.0;
    let timer;
    let sideSelected = "";

    function updateUI() { document.getElementById('wallet').innerText = wallet.toFixed(2); }
    function showPage(id) { document.getElementById(id).style.display = "flex"; }
    function hidePages() { document.querySelectorAll('.page').forEach(p => p.style.display = "none"); }

    function setRoom(r) {
        room = r;
        document.getElementById('display-area').innerHTML = `<h2>${r} MODE</h2>`;
        document.getElementById('dvt-choice').style.display = (r === 'DVT') ? 'flex' : 'none';
    }

    function selectSide(s) { sideSelected = s; alert("Selected: " + s); }

    function startPlay() {
        if(!room || isPlaying) return;
        bet = parseFloat(document.getElementById('bet-input').value);
        if(bet < 10 || bet > wallet) { alert("Insufficient Balance!"); return; }

        wallet -= bet; updateUI(); isPlaying = true;
        document.getElementById('btn-play').style.display = "none";

        if(room === 'CRASH') runCrash();
        if(room === 'MINES') runMines();
        if(room === 'DVT') runDVT();
    }

    function runCrash() {
        document.getElementById('btn-cashout').style.display = "block";
        let d = document.getElementById('display-area');
        mult = 1.0; let crashAt = (Math.random() * 3) + 1;
        timer = setInterval(() => {
            mult += 0.05;
            d.innerHTML = `<h1>${mult.toFixed(2)}x</h1>`;
            if(mult >= crashAt) { addHist(mult.toFixed(2)+"x", "red"); endGame("Crashed!"); }
        }, 150);
    }

    function runMines() {
        let arena = document.getElementById('game-arena');
        let grid = '<div class="mines-grid">';
        for(let i=0; i<25; i++) grid += `<div class="tile" onclick="openMine(this)">?</div>`;
        grid += '</div>';
        arena.innerHTML = grid;
        document.getElementById('btn-cashout').style.display = "block";
        mult = 1.0;
    }

    function openMine(el) {
        if(!isPlaying || el.innerText !== "?") return;
        if(Math.random() < 0.15) { el.innerHTML="💣"; endGame("BOOM!"); }
        else { el.innerHTML="💎"; mult += 0.2; }
    }

    function runDVT() {
        setTimeout(() => {
            let win = Math.random() < 0.5 ? 'Dragon' : 'Tiger';
            document.getElementById('display-area').innerHTML = `<h2>Winner: ${win}</h2>`;
            if(sideSelected === win) { wallet += (bet * 1.9); addHist(win[0]+"-WIN", "green"); }
            else { addHist(win[0]+"-WIN", "red"); }
            updateUI(); endGame();
        }, 1500);
    }

    function cashOutNow() {
        if(!isPlaying) return;
        wallet += (bet * mult);
        addHist(mult.toFixed(2)+"x", "green");
        endGame();
    }

    function endGame(m) {
        if(m) alert(m);
        isPlaying = false; clearInterval(timer);
        document.getElementById('btn-play').style.display = "block";
        document.getElementById('btn-cashout').style.display = "none";
        updateUI();
    }

    function addHist(v, c) {
        let row = document.getElementById('hist-row');
        row.innerHTML = `<span class="h-item" style="background:${c}">${v}</span>` + row.innerHTML;
    }
</script>

</body>
</html>
