<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALEEM ELITE PRO</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #0b0e18; --card: #1c2230; --green: #24d15d; --red: #ff4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* UI Elements */
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        .balance-box { background: #000; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; font-size: 1.1em; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; margin-bottom: 80px; }
        .game-card { background: var(--card); border-radius: 15px; height: 110px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #333; font-weight: bold; flex-direction: column; transition: 0.2s; }
        .game-card:active { transform: scale(0.95); }

        /* Overlays & Modals */
        #game-overlay, .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; text-align: center; }
        .modal { background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 85%; border: 1px solid var(--gold); }
        
        /* Buttons & Inputs */
        input { width: 90%; padding: 12px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #444; border-radius: 8px; text-align: center; }
        .btn-main { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; margin-top: 10px; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: var(--red); color: white; border: none; padding: 10px; border-radius: 8px; z-index: 1100; }

        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h1 style="color:var(--gold)">SALEEM ELITE</h1>
        <input type="email" id="email" placeholder="Gmail Address">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn-main" style="background:var(--gold); width:85%;" onclick="handleAuth('login')">LOGIN</button>
        <button class="btn-main" style="background:transparent; color:white; width:85%;" onclick="handleAuth('reg')">CREATE ACCOUNT</button>
    </div>

    <div class="header">
        <div id="u-name" style="color:#aaa">User</div>
        <div class="balance-box">PKR <span id="u-balance">0.00</span></div>
        <button onclick="logoutUser()" style="background:var(--red); border:none; color:white; padding:8px 12px; border-radius:8px; font-weight:bold;">Logout</button>
    </div>

    <div class="game-grid">
        <div class="game-card" onclick="openGame('Crash')">🚀<br>CRASH</div>
        <div class="game-card" onclick="openGame('Mines')">💣<br>MINES</div>
        <div class="game-card" onclick="openGame('DragonTiger')">🐉<br>DRAGON TIGER</div>
        <div class="game-card" onclick="openGame('Slots')">🎰<br>SLOTS</div>
    </div>

    <div id="game-overlay">
        <button class="close-btn" onclick="exitGame()">EXIT</button>
        <h2 style="color:var(--gold); margin-top:60px;">CRASH GAME</h2>
        <div id="display-mult" style="font-size: 60px; color: var(--gold); margin: 40px 0; font-weight: bold;">1.00x</div>
        <div style="background:var(--card); padding:20px; border-radius:20px; width:85%; margin:0 auto; border:1px solid #444;">
            <input type="number" id="bet-input" value="10">
            <button id="bet-btn" class="btn-main" style="background:var(--green)" onclick="handleBet()">PLACE BET</button>
        </div>
        <p id="game-info" style="color:#888; margin-top:15px;"></p>
    </div>

    <div id="wallet-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="color:var(--gold)">Wallet</h2>
            <input type="number" id="w-amount" placeholder="Enter Amount">
            <input type="text" id="w-phone" placeholder="Phone Number">
            <button class="btn-main" style="background:var(--gold)" onclick="submitRequest()">SUBMIT</button>
            <button class="btn-main" style="background:grey" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button onclick="openModal('Deposit')" style="background:var(--gold); border:none; padding:10px 25px; border-radius:10px; font-weight:bold;">DEPOSIT</button>
        <button onclick="openModal('Withdraw')" style="background:var(--green); border:none; padding:10px 25px; border-radius:10px; font-weight:bold; color:white;">WITHDRAW</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-a-eO1LKw1fUixVSjDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.firebasestorage.app",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e641fc2e337"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let userBal = 0;
    let multiplier = 1.00;
    let isLive = false;
    let betActive = false;
    let betAmt = 0;
    let loop;

    // --- Auth & Logout ---
    function handleAuth(type) {
        const em = document.getElementById('email').value;
        const ps = document.getElementById('pass').value;
        if(type === 'reg') {
            auth.createUserWithEmailAndPassword(em, ps).then(u => {
                db.ref('users/'+u.user.uid).set({ email: em, balance: 120.00 });
            }).catch(e => alert(e.message));
        } else {
            auth.signInWithEmailAndPassword(em, ps).catch(e => alert(e.message));
        }
    }
    function logoutUser() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            db.ref('users/'+user.uid).on('value', s => {
                const d = s.val();
                userBal = d.balance;
                document.getElementById('u-balance').innerText = userBal.toFixed(2);
                document.getElementById('u-name').innerText = d.email.split('@')[0];
            });
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    // --- Game Logic ---
    function openGame(name) {
        if(name !== 'Crash') return alert(name + " Coming Soon!");
        document.getElementById('game-overlay').style.display = 'block';
        resetRound();
    }
    function exitGame() { clearInterval(loop); document.getElementById('game-overlay').style.display = 'none'; }

    function resetRound() {
        clearInterval(loop);
        multiplier = 1.00; isLive = false; betActive = false;
        document.getElementById('display-mult').innerText = "1.00x";
        document.getElementById('display-mult').style.color = "var(--gold)";
        document.getElementById('bet-btn').innerText = "PLACE BET";
        document.getElementById('bet-btn').style.background = "var(--green)";
        document.getElementById('bet-btn').disabled = false;
        document.getElementById('game-info').innerText = "Round starts in 5s...";
        setTimeout(startRound, 5000);
    }

    function startRound() {
        isLive = true;
        document.getElementById('game-info').innerText = "LIVE!";
        loop = setInterval(() => {
            multiplier += 0.01;
            document.getElementById('display-mult').innerText = multiplier.toFixed(2) + "x";
            if(Math.random() < 0.007) { // Crash probability
                clearInterval(loop);
                isLive = false;
                document.getElementById('display-mult').innerText = "CRASHED!";
                document.getElementById('display-mult').style.color = "var(--red)";
                if(betActive) document.getElementById('game-info').innerText = "Lost: " + betAmt;
                setTimeout(resetRound, 3000);
            }
        }, 100);
    }

    function handleBet() {
        if(!betActive && !isLive) {
            let val = parseFloat(document.getElementById('bet-input').value);
            if(val > userBal || val <= 0) return alert("Low Balance!");
            betAmt = val;
            updateBal(-betAmt);
            betActive = true;
            document.getElementById('bet-btn').innerText = "PLACED...";
            document.getElementById('bet-btn').disabled = true;
        } else if(betActive && isLive) {
            let win = betAmt * multiplier;
            updateBal(win);
            betActive = false;
            document.getElementById('bet-btn').innerText = "WON!";
            document.getElementById('bet-btn').style.background = "grey";
            document.getElementById('bet-btn').disabled = true;
            document.getElementById('game-info').innerText = "Won PKR " + win.toFixed(2);
        }
    }

    // --- Wallet Logic ---
    function openModal(mode) {
        document.getElementById('modal-title').innerText = mode;
        document.getElementById('wallet-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('wallet-modal').style.display = 'none'; }

    function submitRequest() {
        const amt = document.getElementById('w-amount').value;
        const ph = document.getElementById('w-phone').value;
        const type = document.getElementById('modal-title').innerText;
        if(!amt || !ph) return alert("Fill all fields!");
        
        db.ref('requests').push({
            uid: auth.currentUser.uid,
            email: auth.currentUser.email,
            amount: amt,
            phone: ph,
            type: type,
            status: "Pending"
        });
        alert(type + " Request Sent to Admin!");
        closeModal();
    }

    function updateBal(amt) {
        db.ref('users/'+auth.currentUser.uid+'/balance').set(userBal + amt);
    }

    // Real-time button update
    setInterval(() => {
        if(isLive && betActive) {
            const btn = document.getElementById('bet-btn');
            btn.innerText = "CASHOUT (" + (betAmt * multiplier).toFixed(2) + ")";
            btn.style.background = "var(--gold)";
            btn.disabled = false;
        }
    }, 100);
</script>
</body>
</html>
