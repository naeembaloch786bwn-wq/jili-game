<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - BALOCH PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; --green: #2ecc71; --red: #e74c3c; --blue: #3498db; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; text-align: center; user-select: none; }
        
        /* Auth Screen */
        #auth-container { padding: 40px 20px; display: block; }
        .auth-box { background: #111; padding: 20px; border-radius: 12px; border: 1.5px solid var(--gold); }
        
        /* Main Game Screen */
        #main-game { display: none; }
        header { background: #111; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 500; }
        .bal-box { border: 1.5px solid var(--gold); padding: 5px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; }
        
        #game-arena { width: 92%; height: 250px; background: radial-gradient(circle, #1a3c1a, #000); margin: 10px auto; border: 3px solid var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; border-top: 2px solid var(--gold); z-index: 1000; }
        .btn-play { background: var(--gold); color: black; width: 90%; font-size: 18px; font-weight: bold; padding: 12px; border: none; border-radius: 5px; margin-top: 5px; }
        
        .nav-row { display: flex; gap: 5px; padding: 10px; justify-content: center; }
        .nav-item { flex: 1; background: #111; border: 1px solid #333; padding: 8px; font-size: 11px; border-radius: 5px; color: gold; cursor: pointer; }
        
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px; }
        .tile { width: 42px; height: 42px; background: #222; border: 1px solid #444; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        input, select { background: #000; border: 1px solid var(--gold); color: #fff; padding: 10px; width: 85%; margin-bottom: 10px; border-radius: 5px; text-align: center; }
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 2000; padding-top: 50px; }
    </style>
</head>
<body>

<div id="auth-container">
    <h1 style="color:gold">777 ULTRA</h1>
    <div class="auth-box" id="login-form">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn-play" onclick="login()">LOGIN</button>
        <p onclick="toggleAuth(false)" style="color:var(--blue); font-size:13px; margin-top:10px;">New User? Register (80 Bonus)</p>
    </div>
    <div class="auth-box" id="signup-form" style="display:none">
        <input type="text" id="user-name" placeholder="Full Name">
        <input type="email" id="s-email" placeholder="Email Address">
        <input type="password" id="s-pass" placeholder="Create Password">
        <button class="btn-play" style="background:var(--green); color:white" onclick="signup()">SIGNUP & GET 80</button>
        <p onclick="toggleAuth(true)" style="color:var(--blue); font-size:13px; margin-top:10px;">Back to Login</p>
    </div>
</div>

<div id="main-game">
    <header>
        <button onclick="logout()" style="background:red; color:white; border:none; padding:5px; border-radius:4px; font-size:10px;">LOGOUT</button>
        <div style="color:gold; font-weight:bold;">777 ULTRA</div>
        <div class="bal-box">PKR <span id="wallet">0.00</span></div>
    </header>

    <div id="game-arena">
        <div id="display-area"><h2>SELECT A GAME</h2></div>
    </div>

    <div class="nav-row">
        <div class="nav-item" onclick="setRoom('CRASH')">🚀 CRASH</div>
        <div class="nav-item" onclick="setRoom('MINES')">💣 MINES</div>
        <div class="nav-item" onclick="setRoom('DVT')">🐉 D-TIGER</div>
    </div>

    <div class="controls">
        <div id="dvt-choice" style="display:none; gap:10px; margin-bottom:10px; justify-content:center;">
            <button onclick="side='Dragon'; alert('Dragon Set')" style="background:red; color:white; border:none; padding:8px; border-radius:4px;">DRAGON</button>
            <button onclick="side='Tiger'; alert('Tiger Set')" style="background:blue; color:white; border:none; padding:8px; border-radius:4px;">TIGER</button>
        </div>
        <input type="number" id="bet-input" value="10">
        <button id="btn-play" class="btn-play" onclick="startPlay()">START GAME</button>
        <button id="btn-cashout" class="btn-play" style="display:none; background:var(--green); color:white" onclick="cashOut()">CASHOUT</button>
        <div style="display:flex; justify-content:space-around; margin-top:10px;">
            <button onclick="showPage('dep-page')" style="background:var(--green); border:none; padding:8px 15px; border-radius:4px; color:white; font-size:11px;">DEPOSIT</button>
            <button onclick="showPage('wit-page')" style="background:#444; border:none; padding:8px 15px; border-radius:4px; color:white; font-size:11px;">WITHDRAW</button>
        </div>
    </div>
</div>

<div id="dep-page" class="page">
    <h2>DEPOSIT</h2>
    <p>JazzCash: 03289230760 (Naeem)</p>
    <input type="number" id="d-amt" placeholder="Enter Amount">
    <button class="btn-play" onclick="processDep()">SUBMIT</button>
    <button onclick="hidePages()" style="color:white; background:none; border:none; margin-top:20px;">BACK</button>
</div>

<div id="wit-page" class="page">
    <h2>WITHDRAW</h2>
    <input type="number" id="w-amt" placeholder="Enter Amount">
    <button class="btn-play" onclick="processWit()">WITHDRAW</button>
    <button onclick="hidePages()" style="color:white; background:none; border:none; margin-top:20px;">BACK</button>
</div>

<script>
    // --- FINAL FIREBASE SETTINGS ---
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-s-e01LKw1fUixVSjDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.appspot.com",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e63e41fc2e337",
        measurementId: "G-1YYL1T76LN"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentBalance = 0, room = "", side = "", isPlaying = false, bet = 0, mult = 1.0, timer;

    function toggleAuth(l) { document.getElementById('login-form').style.display=l?'block':'none'; document.getElementById('signup-form').style.display=l?'none':'block'; }
    
    async function signup() {
        const email = document.getElementById('s-email').value;
        const pass = document.getElementById('s-pass').value;
        const name = document.getElementById('user-name').value;
        try {
            const res = await auth.createUserWithEmailAndPassword(email, pass);
            await db.collection("users").doc(res.user.uid).set({ name: name, balance: 80.00 });
            alert("Registered! 80 Bonus Added.");
        } catch(e) { alert("Registration Error: " + e.message); }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        try { await auth.signInWithEmailAndPassword(email, pass); } catch(e) { alert("Login Error: Check credentials."); }
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if(user) { document.getElementById('auth-container').style.display='none'; document.getElementById('main-game').style.display='block'; sync(); }
        else { document.getElementById('auth-container').style.display='block'; document.getElementById('main-game').style.display='none'; }
    });

    async function sync() { 
        if(!auth.currentUser) return;
        const doc = await db.collection("users").doc(auth.currentUser.uid).get();
        currentBalance = doc.data().balance; 
        document.getElementById('wallet').innerText = currentBalance.toFixed(2); 
    }

    async function updateDB(a) { 
        currentBalance += a; 
        await db.collection("users").doc(auth.currentUser.uid).update({ balance: currentBalance }); 
        sync(); 
    }

    function setRoom(r) { 
        room = r; 
        document.getElementById('display-area').innerHTML = `<h2>${r} READY</h2>`; 
        document.getElementById('dvt-choice').style.display = (r === 'DVT' ? 'flex' : 'none'); 
    }

    function startPlay() {
        bet = parseFloat(document.getElementById('bet-input').value);
        if(bet > currentBalance || bet < 10 || isPlaying) return alert("Check Balance/Bet");
        updateDB(-bet); isPlaying = true;
        document.getElementById('btn-play').style.display = 'none';
        if(room === 'MINES') runMines();
        else if(room === 'CRASH') runCrash();
        else if(room === 'DVT') runDVT();
    }

    function runMines() {
        let h = '<div class="mines-grid">';
        for(let i=0; i<25; i++) h += `<div class="tile" onclick="openTile(this)">?</div>`;
        document.getElementById('game-arena').innerHTML = h + '</div>';
        document.getElementById('btn-cashout').style.display = 'block';
        mult = 1.0;
    }

    function openTile(el) {
        if(!isPlaying || el.innerText !== "?") return;
        if(Math.random() < 0.20) { el.innerHTML="💣"; el.style.background="red"; endGame("BOOM! You Lost."); }
        else { el.innerHTML="💎"; el.style.background="green"; mult *= 1.25; }
    }

    function runCrash() {
        document.getElementById('game-arena').innerHTML = '<h1 id="m-val">1.00x</h1>';
        document.getElementById('btn-cashout').style.display = 'block';
        mult = 1.0; let crashAt = (Math.random()*2.5+1.1).toFixed(2);
        timer = setInterval(() => {
            mult += 0.05; document.getElementById('m-val').innerText = mult.toFixed(2)+"x";
            if(mult >= crashAt) endGame("CRASHED!");
        }, 150);
    }

    function runDVT() {
        if(!side) { alert("Select Side!"); isPlaying = false; document.getElementById('btn-play').style.display = 'block'; return; }
        document.getElementById('game-arena').innerHTML = "<h1>DRAGON VS TIGER</h1>";
        setTimeout(() => {
            let win = Math.random() < 0.5 ? "Dragon" : "Tiger";
            if(side === win) { updateDB(bet * 1.9); alert(win + " Wins! You Won."); }
            else alert(win + " Wins! You Lost.");
            endGame();
        }, 2000);
    }

    function cashOut() { if(!isPlaying) return; updateDB(bet * mult); endGame("Success! Won: " + (bet*mult).toFixed(2)); }
    function endGame(m) { if(m) alert(m); isPlaying = false; clearInterval(timer); document.getElementById('btn-play').style.display = 'block'; document.getElementById('btn-cashout').style.display = 'none'; }
    
    function processDep() { updateDB(parseFloat(document.getElementById('d-amt').value)); alert("Deposit Added"); hidePages(); }
    function processWit() { let a = parseFloat(document.getElementById('w-amt').value); if(a<=currentBalance){updateDB(-a); alert("Withdraw Success"); hidePages();} else alert("Low Balance"); }
    
    function showPage(id) { document.getElementById(id).style.display = 'block'; }
    function hidePages() { document.querySelectorAll('.page').forEach(p => p.style.display='none'); }
</script>
</body>
</html>
