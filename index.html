<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - NAEEM PRO ENGINE</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; }
        header { background: #111; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .bal-box { border: 1.5px solid var(--gold); padding: 5px 10px; border-radius: 5px; }

        #game-arena { width: 92%; height: 240px; margin: 10px auto; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #333; }
        .history-bar { width: 92%; overflow-x: auto; margin: 5px auto; white-space: nowrap; height: 40px; }
        .h-item { display: inline-block; padding: 5px 10px; margin: 2px; border-radius: 3px; font-weight: bold; color: #000; }

        .main-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 92%; margin: 10px auto; }
        .nav-btn { background: #1a1a1a; border-bottom: 2px solid var(--gold); padding: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: bold; }

        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; box-sizing: border-box; border-top: 1px solid #333; }
        .btn-play { background: var(--gold); color: black; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        .card { width: 55px; height: 80px; background: white; color: black; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; transition: transform 0.6s; transform-style: preserve-3d; margin: 10px; }
        .dvt-select { display: none; gap: 10px; margin-bottom: 10px; justify-content: center; width: 100%; }
        .sel-btn { flex: 1; padding: 10px; border-radius: 5px; border: none; font-weight: bold; color: white; }

        .action-bar { display: flex; gap: 5px; margin-top: 10px; }
        .act-btn { flex: 1; padding: 8px; border-radius: 5px; border: none; background: #333; color: white; font-size: 11px; }

        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .form-box { background: #1a1a1a; padding: 20px; border-radius: 10px; width: 85%; border: 1px solid var(--gold); text-align: center; }
        input, select { background: #000; border: 1px solid #333; color: white; padding: 12px; width: 100%; margin-bottom: 10px; box-sizing: border-box; border-radius: 5px; }

        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 40px; height: 40px; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 18px; }

        /* Auth Styles */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body onload="checkAuth()">

<div id="auth-overlay">
    <div class="form-box">
        <h2 id="auth-title" style="color:var(--gold)">LOGIN</h2>
        <input type="text" id="user-in" placeholder="Username">
        <input type="password" id="pass-in" placeholder="Password">
        <button class="btn-play" onclick="handleAuth()">GO</button>
        <p onclick="toggleAuth()" id="toggle-txt" style="font-size:12px; margin-top:10px;">New? Register</p>
    </div>
</div>

<header>
    <div style="font-weight: 900; color: var(--gold);" onclick="logout()">777 ULTRA</div>
    <div class="bal-box">PKR <span id="wallet">0</span></div>
</header>

<div id="game-arena">
    <div id="display-area" style="text-align:center;"><h2>SELECT GAME</h2></div>
</div>

<div class="history-bar" id="hist-row"></div>

<div class="main-nav">
    <div class="nav-btn" onclick="setRoom('CRASH')">CRASH</div>
    <div class="nav-btn" onclick="setRoom('MINES')">MINES</div>
    <div class="nav-btn" onclick="setRoom('DVT')">DVT</div>
</div>

<div class="controls">
    <div id="dvt-choice" class="dvt-select">
        <button class="sel-btn" style="background: #e74c3c;" onclick="selectSide('Dragon')">Dragon</button>
        <button class="sel-btn" style="background: #3498db;" onclick="selectSide('Tiger')">Tiger</button>
    </div>
    <input type="number" id="bet-input" value="10">
    <button id="btn-play" class="btn-play" onclick="startPlay()">START PLAY</button>
    <button id="btn-cashout" class="btn-play" style="display:none; background: #2ecc71;" onclick="cashOutNow()">CASH OUT</button>

    <div class="action-bar">
        <button class="act-btn" onclick="showPage('dep-page')">DEPOSIT</button>
        <button class="act-btn" onclick="showPage('wit-page')">WITHDRAW</button>
        <button class="act-btn" onclick="showPage('ref-page')">REFER</button>
        <button class="act-btn" onclick="showPage('sup-page')">SUPPORT</button>
    </div>
</div>

<div id="dep-page" class="page">
    <div class="form-box">
        <h2 style="color:var(--gold)">DEPOSIT</h2>
        <p>Send to JazzCash: 03289230760</p>
        <input type="number" id="d-amt" placeholder="Amount">
        <input type="text" id="d-tid" placeholder="TID">
        <button class="btn-play" onclick="doDeposit()">SUBMIT</button>
        <button onclick="hidePages()" style="background:none; border:none; color:#777; width:100%; margin-top:10px;">BACK</button>
    </div>
</div>

<div id="wit-page" class="page">
    <div class="form-box">
        <h2 style="color:var(--gold)">WITHDRAW</h2>
        <input type="number" id="w-amt" placeholder="Amount">
        <input type="text" id="w-num" placeholder="Account Number">
        <button class="btn-play" onclick="doWithdraw()">WITHDRAW</button>
        <button onclick="hidePages()" style="background:none; border:none; color:#777; width:100%; margin-top:10px;">BACK</button>
    </div>
</div>

<script>
    let wallet = 150.0;
    let room = "", isPlaying = false, bet = 0, mult = 1.0, timer, sideSelected = "", isLogin = true;

    // --- AUTH ---
    function checkAuth() {
        if(localStorage.getItem("loggedUser")) {
            document.getElementById('auth-overlay').style.display='none';
            wallet = parseFloat(localStorage.getItem("naeem_bal")) || 150;
            updateUI();
        }
    }
    function toggleAuth() {
        isLogin = !isLogin;
        document.getElementById('auth-title').innerText = isLogin ? "LOGIN" : "REGISTER";
        document.getElementById('toggle-txt').innerText = isLogin ? "New? Register" : "Have account? Login";
    }
    function handleAuth() {
        let u = document.getElementById('user-in').value;
        let p = document.getElementById('pass-in').value;
        if(isLogin) {
            if(u === localStorage.getItem("saved_u") && p === localStorage.getItem("saved_p")) {
                localStorage.setItem("loggedUser", u); checkAuth();
            } else alert("Wrong!");
        } else {
            localStorage.setItem("saved_u", u); localStorage.setItem("saved_p", p);
            localStorage.setItem("naeem_bal", 150); toggleAuth(); alert("Done!");
        }
    }
    function logout() { localStorage.removeItem("loggedUser"); location.reload(); }

    // --- CORE ---
    function updateUI() { document.getElementById('wallet').innerText = wallet.toFixed(2); localStorage.setItem("naeem_bal", wallet); }
    function showPage(id) { document.getElementById(id).style.display = "flex"; }
    function hidePages() { document.querySelectorAll('.page').forEach(p => p.style.display="none"); }

    function doDeposit() { 
        let a = parseFloat(document.getElementById('d-amt').value);
        if(a > 0) { wallet += a; updateUI(); hidePages(); alert("Success!"); }
    }
    function doWithdraw() {
        let a = parseFloat(document.getElementById('w-amt').value);
        if(a <= wallet) { wallet -= a; updateUI(); hidePages(); alert("Pending!"); }
    }

    // --- GAMES (No Changes) ---
    function setRoom(r) {
        room = r; document.getElementById('display-area').innerHTML = `<h2>${r} MODE</h2>`;
        document.getElementById('dvt-choice').style.display = (r === 'DVT') ? 'flex' : 'none';
        document.getElementById('btn-play').style.display = "block";
        document.getElementById('btn-cashout').style.display = "none";
    }
    function selectSide(s) { sideSelected = s; }

    function startPlay() {
        if(!room || isPlaying) return;
        bet = parseFloat(document.getElementById('bet-input').value);
        if(bet < 10 || bet > wallet) return alert("Low!");
        wallet -= bet; updateUI(); isPlaying = true;
        document.getElementById('btn-play').style.display = "none";
        if(room === 'CRASH') runCrash(); else if(room === 'MINES') runMines(); else if(room === 'DVT') runDVT();
    }

    function runCrash() {
        document.getElementById('btn-cashout').style.display = "block";
        mult = 1.0; 
        let crashAt = (Math.random() < 0.65) ? (Math.random() * 0.2) + 1.01 : (Math.random() * 3) + 1.5;
        timer = setInterval(() => {
            mult += 0.05; document.getElementById('display-area').innerHTML = `<h1>${mult.toFixed(2)}x</h1>`;
            if(mult >= crashAt) { addHist(mult.toFixed(2)+"x", "red"); end(); }
        }, 150);
    }

    function runMines() {
        document.getElementById('btn-cashout').style.display = "block";
        let g = '<div class="mines-grid">';
        for(let i=0; i<25; i++) g += `<div class="tile" onclick="openT(this)">?</div>`;
        document.getElementById('display-area').innerHTML = g + '</div>'; mult = 1.0;
    }
    function openT(el) {
        if(!isPlaying || el.innerText !== "?") return;
        if(Math.random() < 0.55) { el.innerHTML="💣"; end(); }
        else { el.innerHTML="💎"; mult += 0.25; }
    }

    function runDVT() {
        document.getElementById('display-area').innerHTML = `<div id="d-card" class="card">?</div><div id="t-card" class="card">?</div>`;
        setTimeout(() => {
            let win = (Math.random() < 0.35) ? sideSelected : (sideSelected === 'Dragon' ? 'Tiger' : 'Dragon');
            document.getElementById('d-card').innerText = Math.floor(Math.random()*10)+1;
            document.getElementById('t-card').innerText = Math.floor(Math.random()*10)+1;
            document.getElementById('d-card').style.transform = "rotateY(360deg)";
            document.getElementById('t-card').style.transform = "rotateY(360deg)";
            setTimeout(() => {
                if(sideSelected === win) { wallet += (bet * 1.9); addHist(win[0], "green"); }
                else addHist(win[0], "red");
                updateUI(); end();
            }, 1000);
        }, 800);
    }

    function cashOutNow() { wallet += (bet * mult); addHist(mult.toFixed(2)+"x", "green"); end(); }
    function end() { isPlaying = false; clearInterval(timer); document.getElementById('btn-play').style.display="block"; document.getElementById('btn-cashout').style.display="none"; updateUI(); }
    function addHist(v, c) {
        let r = document.getElementById('hist-row');
        r.innerHTML = `<span class="h-item" style="background:${c}">${v}</span>` + r.innerHTML;
    }
</script>
</body>
</html>
