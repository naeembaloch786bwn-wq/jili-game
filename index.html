<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - BALOCH OFFICIAL</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; --green: #2ecc71; --red: #e74c3c; --blue: #3498db; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; text-align: center; user-select: none; }
        #auth-container { padding: 40px 20px; display: block; }
        .auth-box { background: #111; padding: 20px; border-radius: 12px; border: 1.5px solid var(--gold); }
        #main-game { display: none; }
        header { background: #111; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 500; }
        .bal-box { border: 1.5px solid var(--gold); padding: 5px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; }
        #game-arena { width: 92%; height: 250px; background: radial-gradient(circle, #1a3c1a, #000); margin: 10px auto; border: 3px solid var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; border-top: 2px solid var(--gold); z-index: 1000; }
        .btn-play { background: var(--gold); color: black; width: 90%; font-size: 18px; font-weight: bold; padding: 12px; border: none; border-radius: 5px; margin-top: 10px; }
        .nav-row { display: flex; gap: 5px; padding: 10px; justify-content: center; }
        .nav-item { flex: 1; background: #111; border: 1px solid #333; padding: 8px; font-size: 11px; border-radius: 5px; color: gold; cursor: pointer; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px; }
        .tile { width: 40px; height: 40px; background: #222; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        input { background: #000; border: 1px solid var(--gold); color: #fff; padding: 12px; width: 85%; margin-bottom: 12px; border-radius: 5px; text-align: center; }
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 2000; padding-top: 50px; }
    </style>
</head>
<body>

<div id="auth-container">
    <h1 style="color:var(--gold)">777 ULTRA</h1>
    <div class="auth-box" id="login-form">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn-play" onclick="login()">LOGIN</button>
        <p onclick="toggleAuth(false)" style="color:var(--blue); font-size:13px; margin-top:10px;">Register Account (80 Bonus)</p>
    </div>
    <div class="auth-box" id="signup-form" style="display:none">
        <input type="text" id="user-name" placeholder="Full Name">
        <input type="email" id="s-email" placeholder="Email">
        <input type="password" id="s-pass" placeholder="Password">
        <button class="btn-play" style="background:var(--green); color:white" onclick="signup()">SIGNUP</button>
        <p onclick="toggleAuth(true)" style="color:var(--blue); font-size:13px; margin-top:10px;">Back to Login</p>
    </div>
</div>

<div id="main-game">
    <header>
        <button onclick="logout()" style="background:red; color:white; border:none; padding:5px 8px; border-radius:4px; font-size:10px;">LOGOUT</button>
        <div style="color:gold; font-weight:bold;">777 ULTRA</div>
        <div class="bal-box">PKR <span id="wallet">0.00</span></div>
    </header>

    <div id="game-arena"><div id="display-area"><h2>SELECT GAME</h2></div></div>

    <div class="nav-row">
        <div class="nav-item" onclick="setRoom('CRASH')">🚀 CRASH</div>
        <div class="nav-item" onclick="setRoom('MINES')">💣 MINES</div>
        <div class="nav-item" onclick="setRoom('DVT')">🐉 D-TIGER</div>
    </div>

    <div class="controls">
        <div id="dvt-choice" style="display:none; gap:10px; margin-bottom:10px; justify-content:center;">
            <button onclick="side='Dragon'; alert('Dragon Set')" style="background:red; color:white; border:none; padding:8px; border-radius:4px;">DRAGON</button>
            <button onclick="side='Tiger'; alert('Tiger Set')" style="background:blue; color:white; border:none; padding:8px; border-radius:4px;">TIGER</button>
        </div>
        <input type="number" id="bet-input" value="10">
        <button id="btn-play" class="btn-play" onclick="startPlay()">START GAME</button>
        <button id="btn-cashout" class="btn-play" style="display:none; background:var(--green); color:white" onclick="cashOut()">CASHOUT</button>
    </div>
</div>

<script>
    // --- SAFE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-s-e01LKw1fUixVSjDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.appspot.com",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e63e41fc2e337"
    };

    // Error bypasser
    try {
        firebase.initializeApp(firebaseConfig);
    } catch(e) { console.log("Firebase Init Bypass"); }

    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentBalance = 80.00, room = "", side = "", isPlaying = false, bet = 0, mult = 1.0;

    function toggleAuth(l) { 
        document.getElementById('login-form').style.display=l?'block':'none'; 
        document.getElementById('signup-form').style.display=l?'none':'block'; 
    }

    async function signup() {
        const email = document.getElementById('s-email').value;
        const pass = document.getElementById('s-pass').value;
        try {
            await auth.createUserWithEmailAndPassword(email, pass);
            await db.collection("users").doc(auth.currentUser.uid).set({ balance: 80 });
            enterGame();
        } catch(e) { 
            alert("Safe Entry: Welcome!"); 
            enterGame(); // Agar API error de, phir bhi game mein entry de dega
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        try {
            await auth.signInWithEmailAndPassword(email, pass);
            enterGame();
        } catch(e) { 
            alert("Safe Login Activated."); 
            enterGame(); 
        }
    }

    function enterGame() {
        document.getElementById('auth-container').style.display='none';
        document.getElementById('main-game').style.display='block';
        updateUI();
    }

    function updateUI() { document.getElementById('wallet').innerText = currentBalance.toFixed(2); }

    function setRoom(r) { 
        room = r; 
        document.getElementById('display-area').innerHTML = `<h2>${r} READY</h2>`; 
        document.getElementById('dvt-choice').style.display = (r === 'DVT' ? 'flex' : 'none');
    }

    function startPlay() {
        bet = parseFloat(document.getElementById('bet-input').value);
        if(bet > currentBalance) return alert("Low Balance!");
        currentBalance -= bet; updateUI();
        isPlaying = true;
        document.getElementById('btn-play').style.display = 'none';
        if(room === 'MINES') runMines();
        else if(room === 'CRASH') runCrash();
        else if(room === 'DVT') runDVT();
    }

    function runMines() {
        let h = '<div class="mines-grid">';
        for(let i=0; i<25; i++) h += `<div class="tile" onclick="openTile(this)">?</div>`;
        document.getElementById('game-arena').innerHTML = h + '</div>';
        document.getElementById('btn-cashout').style.display = 'block';
        mult = 1.0;
    }

    function openTile(el) {
        if(!isPlaying || el.innerText !== "?") return;
        if(Math.random() < 0.15) { el.innerHTML="💣"; el.style.background="red"; endGame("BOOM!"); }
        else { el.innerHTML="💎"; el.style.background="green"; mult *= 1.3; }
    }

    function runCrash() {
        document.getElementById('game-arena').innerHTML = '<h1 id="m-val">1.00x</h1>';
        document.getElementById('btn-cashout').style.display = 'block';
        mult = 1.0; let cAt = (Math.random()*2+1.1).toFixed(2);
        let t = setInterval(() => {
            mult += 0.05; document.getElementById('m-val').innerText = mult.toFixed(2)+"x";
            if(mult >= cAt || !isPlaying) { clearInterval(t); if(isPlaying) endGame("CRASHED!"); }
        }, 200);
    }

    function runDVT() {
        setTimeout(() => {
            let win = Math.random() < 0.5 ? "Dragon" : "Tiger";
            if(side === win) { currentBalance += bet*1.9; alert("You Won!"); }
            else alert("You Lost!");
            endGame();
        }, 2000);
    }

    function cashOut() { if(!isPlaying) return; currentBalance += (bet * mult); endGame("Won: " + (bet*mult).toFixed(2)); }
    function endGame(m) { if(m) alert(m); isPlaying = false; document.getElementById('btn-play').style.display = 'block'; document.getElementById('btn-cashout').style.display = 'none'; updateUI(); }
    function logout() { location.reload(); }
</script>
</body>
</html>
