<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Patti Pro - Fixed</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --yellow: #fcd535; --green: #2ebd85; --red: #f6465d; --text: #eaecef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .page { display: none; padding: 20px; min-height: 100vh; }
        .active { display: block; }
        input { width: 100%; padding: 12px; background: #2b3139; border: 1px solid #474d57; border-radius: 8px; color: white; margin: 10px 0; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .header { background: #181a20; padding: 15px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--yellow); }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .g-card { background: var(--card); padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid #2b3139; }
        /* Game Specific UI */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 20px 0; }
        .tile { aspect-ratio: 1; background: #2b3139; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 20px; }
        #crash-area { font-size: 40px; margin: 40px 0; color: var(--yellow); }
    </style>
</head>
<body>

    <div id="page-login" class="page active">
        <h1 style="text-align:center; color:var(--yellow); margin-top:50px;">3Patti Pro</h1>
        <input type="email" id="l-email" placeholder="Email">
        <input type="password" id="l-pass" placeholder="Password">
        <button class="btn" style="background:var(--yellow)" onclick="doLogin()">LOGIN</button>
        <p style="text-align:center; margin-top:20px;" onclick="showPage('page-signup')">Create Account</p>
    </div>

    <div id="page-signup" class="page">
        <h2>Register</h2>
        <input type="email" id="s-email" placeholder="Email">
        <input type="password" id="s-pass" placeholder="Password">
        <button class="btn" style="background:var(--yellow)" onclick="doSignup()">REGISTER (Bonus 230)</button>
    </div>

    <div id="page-dash" class="page" style="padding:0;">
        <div class="header">
            <span id="u-email">User</span>
            <span style="color:var(--yellow)">PKR <b id="u-bal">0.00</b></span>
        </div>
        <div style="padding:20px;">
            <div class="game-grid">
                <div class="g-card" onclick="showPage('page-mines')">💣<br>MINES</div>
                <div class="g-card" onclick="showPage('page-crash')">🚀<br>CRASH</div>
                <div class="g-card" onclick="showPage('page-dt')">🐯<br>DRAGON TIGER</div>
                <div class="g-card" onclick="showPage('page-refer')">🎁<br>REFER</div>
            </div>
            <button class="btn" style="background:var(--green); margin-top:20px;" onclick="showPage('page-deposit')">DEPOSIT</button>
            <button class="btn" style="background:var(--red)" onclick="auth.signOut()">LOGOUT</button>
        </div>
    </div>

    <div id="page-mines" class="page">
        <button onclick="showPage('page-dash')">← Back</button>
        <div class="grid" id="m-board"></div>
        <input type="number" id="m-bet" placeholder="Bet Amount">
        <button class="btn" style="background:var(--yellow)" id="m-start" onclick="startMines()">START MINES</button>
        <button class="btn" style="background:var(--green); display:none;" id="m-cash" onclick="cashMines()">CASHOUT</button>
    </div>

    <div id="page-crash" class="page">
        <button onclick="showPage('page-dash')">← Back</button>
        <div id="crash-area">1.00x</div>
        <input type="number" id="c-bet" placeholder="Bet Amount">
        <button class="btn" style="background:var(--yellow)" id="c-start" onclick="startCrash()">START ROCKET</button>
        <button class="btn" style="background:var(--green); display:none;" id="c-cash" onclick="cashCrash()">CASHOUT</button>
    </div>

    <div id="page-deposit" class="page">
        <button onclick="showPage('page-dash')">← Back</button>
        <h3>Deposit to Naeem</h3>
        <p>JazzCash: 03289230760</p>
        <input type="number" id="d-amt" placeholder="Amount">
        <input type="text" id="d-tid" placeholder="TID">
        <button class="btn" style="background:var(--green)" onclick="saveDep()">SUBMIT</button>
    </div>

    <script>
        // FIXED API KEY & CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDTNneivrTie-a-e0ilKwifU", 
            authDomain: "pattipro-clffe.firebaseapp.com",
            projectId: "pattipro-clffe",
            storageBucket: "pattipro-clffe.appspot.com",
            messagingSenderId: "766843054614",
            appId: "1:766843054614:web:781658832c63e4ffc2c337"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let userData = null;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // AUTH
        function doSignup() {
            const e = document.getElementById('s-email').value, p = document.getElementById('s-pass').value;
            auth.createUserWithEmailAndPassword(e,p).then(r => {
                db.ref('users/'+r.user.uid).set({email:e, balance:230});
            }).catch(m => alert(m.message));
        }
        function doLogin() {
            const e = document.getElementById('l-email').value, p = document.getElementById('l-pass').value;
            auth.signInWithEmailAndPassword(e,p).catch(m => alert(m.message));
        }

        auth.onAuthStateChanged(u => {
            if(u) {
                db.ref('users/'+u.uid).on('value', s => {
                    userData = s.val();
                    document.getElementById('u-email').innerText = userData.email;
                    document.getElementById('u-bal').innerText = userData.balance.toFixed(2);
                    showPage('page-dash');
                });
            } else { showPage('page-login'); }
        });

        // MINES LOGIC
        let mActive = false, mines = [], mBet = 0, mMult = 1.0;
        function startMines() {
            mBet = parseFloat(document.getElementById('m-bet').value);
            if(mBet > userData.balance || mBet < 20) return alert("Low Balance");
            db.ref('users/'+auth.currentUser.uid).update({balance: userData.balance - mBet});
            mActive = true; mines = []; mMult = 1.0;
            while(mines.length < 3) { let r = Math.floor(Math.random()*25); if(!mines.includes(r)) mines.push(r); }
            const board = document.getElementById('m-board'); board.innerHTML = '';
            for(let i=0; i<25; i++) {
                let t = document.createElement('div'); t.className = 'tile';
                t.onclick = () => {
                    if(!mActive || t.innerHTML) return;
                    if(mines.includes(i)) { t.innerHTML='💣'; t.style.background='red'; mActive=false; alert("Loss!"); showPage('page-dash'); }
                    else { t.innerHTML='💎'; t.style.background='green'; mMult += 0.3; document.getElementById('m-cash').innerText=`Cashout ${(mBet*mMult).toFixed(2)}`; }
                };
                board.appendChild(t);
            }
            document.getElementById('m-start').style.display='none';
            document.getElementById('m-cash').style.display='block';
        }
        function cashMines() {
            db.ref('users/'+auth.currentUser.uid).update({balance: userData.balance + (mBet*mMult)});
            alert("Won!"); showPage('page-dash');
            document.getElementById('m-start').style.display='block';
            document.getElementById('m-cash').style.display='none';
        }

        // CRASH LOGIC
        let cActive = false, cBet = 0, cMult = 1.0, cInterval;
        function startCrash() {
            cBet = parseFloat(document.getElementById('c-bet').value);
            if(cBet > userData.balance || cBet < 20) return alert("Low Balance");
            db.ref('users/'+auth.currentUser.uid).update({balance: userData.balance - cBet});
            cActive = true; cMult = 1.0;
            document.getElementById('c-start').style.display='none';
            document.getElementById('c-cash').style.display='block';
            let crashPoint = (Math.random() * 4 + 1).toFixed(2);
            cInterval = setInterval(() => {
                cMult += 0.02;
                document.getElementById('crash-area').innerText = cMult.toFixed(2) + 'x';
                document.getElementById('c-cash').innerText = `Cashout ${(cBet*cMult).toFixed(2)}`;
                if(cMult >= crashPoint) {
                    clearInterval(cInterval); cActive = false;
                    document.getElementById('crash-area').innerText = 'CRASHED!';
                    setTimeout(() => showPage('page-dash'), 2000);
                }
            }, 100);
        }
        function cashCrash() {
            clearInterval(cInterval);
            db.ref('users/'+auth.currentUser.uid).update({balance: userData.balance + (cBet*cMult)});
            alert("Success!"); showPage('page-dash');
            document.getElementById('c-start').style.display='block';
            document.getElementById('c-cash').style.display='none';
        }

        function saveDep() {
            const a = document.getElementById('d-amt').value, t = document.getElementById('d-tid').value;
            db.ref('deposits').push({uid: auth.currentUser.uid, amt: a, tid: t, status: 'pending'});
            alert("Pending Approval"); showPage('page-dash');
        }
    </script>
</body>
</html>
