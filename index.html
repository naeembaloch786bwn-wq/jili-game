<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - NAEEM PRO ENGINE</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; }
        header { background: #111; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .bal-box { border: 1.5px solid var(--gold); padding: 5px 10px; border-radius: 5px; }

        #game-arena { width: 92%; height: 240px; margin: 10px auto; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .history-bar { width: 92%; overflow-x: auto; margin: 5px auto; white-space: nowrap; height: 40px; }
        .h-item { display: inline-block; padding: 5px 10px; margin: 2px; border-radius: 3px; font-weight: bold; }

        .main-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 92%; margin: 10px auto; }
        .nav-btn { background: #1a1a1a; border-bottom: 2px solid var(--gold); padding: 12px; text-align: center; cursor: pointer; font-size: 14px; }

        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; box-sizing: border-box; border-top: 1px solid #333; }
        .btn-play { background: var(--gold); color: black; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; }
        
        .dvt-select { display: none; gap: 10px; margin-bottom: 10px; justify-content: center; }
        .sel-btn { padding: 10px 20px; border-radius: 5px; border: none; font-weight: bold; }

        .action-bar { display: flex; gap: 5px; margin-top: 10px; }
        .act-btn { flex: 1; padding: 8px; border-radius: 5px; border: none; background: #333; color: white; font-size: 11px; }

        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .form-box { background: #1a1a1a; margin: 15px; padding: 20px; border-radius: 10px; width: 85%; border: 1px solid var(--gold); }
        input, select { background: #000; border: 1px solid #333; color: white; padding: 12px; width: 100%; margin-bottom: 10px; box-sizing: border-box; border-radius: 5px; }

        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 40px; height: 40px; background: #333; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--gold);">NAEEM PRO</div>
    <div class="bal-box">PKR <span id="wallet">150</span></div>
</header>

<div id="game-arena">
    <div id="display-area"><h2>CHOOSE GAME</h2></div>
</div>

<div class="history-bar" id="hist-row"></div>

<div class="main-nav">
    <div class="nav-btn" onclick="setRoom('CRASH')">CRASH</div>
    <div class="nav-btn" onclick="setRoom('MINES')">MINES</div>
    <div class="nav-btn" onclick="setRoom('DVT')">DVT</div>
</div>

<div class="controls">
    <div id="dvt-choice" class="dvt-select">
        <button class="sel-btn" style="background: #e74c3c; color: white;" onclick="selectSide('Dragon')">Dragon</button>
        <button class="sel-btn" style="background: #3498db; color: white;" onclick="selectSide('Tiger')">Tiger</button>
    </div>
    <input type="number" id="bet-input" value="10">
    <button id="btn-play" class="btn-play" onclick="startPlay()">START PLAY</button>
    <button id="btn-cashout" class="btn-play" style="display:none; background: #2ecc71;" onclick="cashOutNow()">CASH OUT</button>

    <div class="action-bar">
        <button class="act-btn" onclick="showPage('dep-page')">DEPOSIT</button>
        <button class="act-btn" onclick="showPage('wit-page')">WITHDRAW</button>
        <button class="act-btn" onclick="showPage('ref-page')">REFER</button>
        <button class="act-btn" onclick="showPage('sup-page')">SUPPORT</button>
    </div>
</div>

<div id="dep-page" class="page">
    <h2>DEPOSIT</h2>
    <div class="form-box">
        <p>Send JazzCash to: <b>03289230760</b></p>
        <input type="number" id="d-num" placeholder="Sender Number">
        <input type="number" id="d-amt" placeholder="Amount">
        <input type="text" id="d-tid" placeholder="Transaction ID">
        <button class="btn-play" onclick="processDeposit()">SUBMIT</button>
    </div>
    <button onclick="hidePages()" style="color:white; background:none; border:none; margin-top:10px;">CLOSE</button>
</div>

<div id="wit-page" class="page">
    <h2>WITHDRAW</h2>
    <div class="form-box">
        <select id="w-method">
            <option value="EasyPaisa">EasyPaisa</option>
            <option value="JazzCash">JazzCash</option>
        </select>
        <input type="number" id="w-num" placeholder="Account Number">
        <input type="number" id="w-amt" placeholder="Amount">
        <button class="btn-play" onclick="processWithdraw()">WITHDRAW</button>
    </div>
    <button onclick="hidePages()" style="color:white; background:none; border:none; margin-top:10px;">CLOSE</button>
</div>

<div id="ref-page" class="page">
    <h2>REFER & EARN</h2>
    <div class="form-box">
        <p>Invite friends for PKR 220 bonus!</p>
        <button class="btn-play" onclick="alert('Copied!')">GET LINK</button>
    </div>
    <button onclick="hidePages()" style="color:white; background:none; border:none; margin-top:10px;">CLOSE</button>
</div>

<div id="sup-page" class="page">
    <h2>SUPPORT</h2>
    <div class="form-box">
        <button class="btn-play" style="background:#25D366;">WHATSAPP</button>
    </div>
    <button onclick="hidePages()" style="color:white; background:none; border:none; margin-top:10px;">CLOSE</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDTNneivrTLe-a-eO1LKw1fUixVSjDfu2k",
    authDomain: "pattipro-c1ffe.firebaseapp.com",
    databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
    projectId: "pattipro-c1ffe",
    storageBucket: "pattipro-c1ffe.appspot.com",
    messagingSenderId: "766843054614",
    appId: "1:766843054614:web:781658832e63e41fc2e337",
    measurementId: "G-1YYL1T76LN"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

<script>
    let wallet = 150.0;
    let room = "";
    let isPlaying = false;
    let bet = 0;
    let mult = 1.0;
    let timer;
    let sideSelected = "";

    function updateUI() { document.getElementById('wallet').innerText = wallet.toFixed(2); }
    function showPage(id) { document.getElementById(id).style.display = "flex"; }
    function hidePages() { document.querySelectorAll('.page').forEach(p => p.style.display = "none"); }

    function setRoom(r) {
        room = r;
        document.getElementById('display-area').innerHTML = `<h2>${r} MODE</h2>`;
        document.getElementById('dvt-choice').style.display = (r === 'DVT') ? 'flex' : 'none';
    }

    function selectSide(s) { sideSelected = s; alert("Side: " + s); }

    function processDeposit() {
        let a = parseFloat(document.getElementById('d-amt').value);
        if(a >= 1599) wallet += 220; // Photo ke mutabiq bonus logic
        wallet += a;
        updateUI(); hidePages();
        alert("Deposit Submitted!");
    }

    function processWithdraw() {
        let a = parseFloat(document.getElementById('w-amt').value);
        if(a > wallet || a < 100) { alert("Invalid!"); return; }
        wallet -= a; updateUI(); hidePages();
        alert("Withdrawal Successful!");
    }

    function startPlay() {
        if(!room || isPlaying) return;
        if(room === 'DVT' && !sideSelected) { alert("Select Side!"); return; }
        bet = parseFloat(document.getElementById('bet-input').value);
        if(bet < 10 || bet > wallet) { alert("Balance Low!"); return; }

        wallet -= bet; updateUI(); isPlaying = true;
        document.getElementById('btn-play').style.display = "none";

        if(room === 'CRASH') runCrash();
        if(room === 'MINES') runMines();
        if(room === 'DVT') runDVT();
    }

    function runCrash() {
        document.getElementById('btn-cashout').style.display = "block";
        let d = document.getElementById('display-area');
        mult = 1.0;
        let crashAt = (Math.random() * 3) + 1;
        timer = setInterval(() => {
            if(!isPlaying) return;
            mult += 0.05;
            d.innerHTML = `<h1>${mult.toFixed(2)}x</h1>`;
            if(mult >= crashAt) { addHist(mult.toFixed(2)+"x", "red"); endGame("Crashed!"); }
        }, 150);
    }

    function runMines() {
        let arena = document.getElementById('game-arena');
        let grid = '<div class="mines-grid">';
        for(let i=0; i<25; i++) grid += `<div class="tile" onclick="openMine(this)">?</div>`;
        grid += '</div>';
        arena.innerHTML = grid;
        document.getElementById('btn-cashout').style.display = "block";
        mult = 1.0;
    }

    function openMine(el) {
        if(!isPlaying || el.innerText !== "?") return;
        if(Math.random() < 0.15) { el.innerHTML="💣"; endGame("BOOM!"); }
        else { el.innerHTML="💎"; mult += 0.2; }
    }

    function runDVT() {
        setTimeout(() => {
            let win = Math.random() < 0.5 ? 'Dragon' : 'Tiger';
            document.getElementById('display-area').innerHTML = `<h2>Winner: ${win}</h2>`;
            if(sideSelected === win) { wallet += (bet * 1.9); addHist(win[0]+"-WIN", "green"); }
            else { addHist(win[0]+"-WIN", "red"); }
            updateUI(); endGame();
        }, 1500);
    }

    function cashOutNow() {
        if(!isPlaying) return;
        wallet += (bet * mult);
        addHist(mult.toFixed(2)+"x", "green");
        endGame("Won: " + (bet*mult).toFixed(2));
    }

    function endGame(m) {
        if(m) alert(m);
        isPlaying = false; clearInterval(timer);
        document.getElementById('btn-play').style.display = "block";
        document.getElementById('btn-cashout').style.display = "none";
        updateUI();
    }

    function addHist(v, c) {
        let row = document.getElementById('hist-row');
        row.innerHTML = `<span class="h-item" style="background:${c}">${v}</span>` + row.innerHTML;
    }
</script>

</body>
</html>
