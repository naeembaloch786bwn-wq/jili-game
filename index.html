<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Casino Pro</title>
    <style>
        body {
            background-color: #000;
            color: #d4af37; /* Gold */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        header {
            background: linear-gradient(180deg, #1a1a1a, #000);
            padding: 20px;
            border-bottom: 2px solid #d4af37;
        }
        .balance-card {
            background: #1a1a1a;
            border: 1px solid #d4af37;
            border-radius: 10px;
            display: inline-block;
            padding: 10px 30px;
            margin-top: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }
        .game-card {
            background: #111;
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 20px;
            font-weight: bold;
            transition: 0.3s;
        }
        .game-card:active {
            transform: scale(0.95);
            background: #d4af37;
            color: #000;
        }
        .footer-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #d4af37;
        }
        button {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>ULTIMATE CASINO</h1>
    <div class="balance-card">
        <p>Wallet Balance</p>
        <h2 id="balance">PKR 150.00</h2>
    </div>
</header>

<div class="game-grid">
    <div class="game-card">🐉 Dragon vs Tiger</div>
    <div class="game-card">💣 Mines</div>
    <div class="game-card">🚀 Crash</div>
    <div class="game-card">🎰 777 Slots</div>
    <div class="game-card">🎡 Roulette</div>
    <div class="game-card">🃏 3 Patti</div>
</div>

<div style="margin-top: 20px; padding: 10px;">
    <p>WhatsApp Support: 03289230760</p>
    <button onclick="alert('Deposit page coming soon!')">Deposit Now</button>
</div>

<div class="footer-nav">
    <span>Home</span>
    <span>Invite</span>
    <span>Withdraw</span>
    <span>Profile</span>
</div>

</body>
</html>
