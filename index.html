<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE 777 - DEPOSIT ENGINE</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; --green: #2ecc71; }
        body { background: var(--bg); color: white; font-family: 'Arial', sans-serif; margin: 0; text-align: center; }
        header { background: #1a1a1a; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .balance-box { border: 2px solid var(--gold); padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; }
        
        /* Deposit Modal Style */
        #deposit-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; padding-top: 50px; }
        .deposit-card { background: #1a1a1a; margin: 20px; padding: 20px; border-radius: 15px; border: 1px solid var(--gold); }
        .copy-btn { background: var(--gold); color: black; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; margin-left: 10px; }
        
        /* Tabs and Main UI */
        .room-nav { display: flex; gap: 10px; overflow-x: auto; padding: 10px; }
        .room-card { min-width: 120px; background: #1a1a1a; padding: 15px; border-radius: 10px; border-bottom: 3px solid var(--gold); }
        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 20px; border-top: 2px solid var(--gold); }
        .btn { width: 85%; padding: 15px; border-radius: 50px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .btn-deposit { background: var(--green); color: white; }
        .btn-confirm { background: var(--gold); color: black; width: 100%; }
        input { background: #000; border: 1px solid var(--gold); color: #fff; padding: 10px; width: 80%; text-align: center; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: var(--gold);">ULTIMATE 777</div>
    <div class="balance-box">PKR <span id="wallet">150.00</span></div>
</header>

<div id="game-arena" style="height: 250px; display: flex; align-items: center; justify-content: center;">
    <h2 id="display">WELCOME PLAYER</h2>
</div>

<div class="room-nav">
    <div class="room-card">🐉 D-TIGER</div>
    <div class="room-card">🚀 CRASH</div>
    <div class="room-card">💣 MINES</div>
</div>

<div class="controls">
    <button class="btn btn-deposit" onclick="showDeposit()">ADD CASH (DEPOSIT)</button>
    <button class="btn" style="background:#444; color:white;">WITHDRAW</button>
</div>

<div id="deposit-page">
    <h2 style="color:var(--gold)">DEPOSIT CASH</h2>
    <div class="deposit-card">
        <p style="color:#888; font-size: 12px;">SEND PAYMENT TO JAZZCASH</p>
        <h3 id="jazzcash-num">03289230760</h3>
        <p>Holder: <b>Saleem</b></p>
        <button class="copy-btn" onclick="copyNum()">COPY NUMBER</button>
    </div>

    <div class="deposit-card">
        <p>Enter Amount Paid:</p>
        <input type="number" id="dep-amt" placeholder="Minimum 100">
        <p>Enter Transaction ID (TID):</p>
        <input type="text" id="dep-tid" placeholder="Enter 12-digit TID">
        <button class="btn btn-confirm" onclick="submitDeposit()">SUBMIT REQUEST</button>
    </div>
    <button style="background:none; border:none; color:white; text-decoration: underline;" onclick="hideDeposit()">Go Back</button>
</div>

<script>
    let wallet = 150.00;

    function showDeposit() { document.getElementById('deposit-page').style.display = 'block'; }
    function hideDeposit() { document.getElementById('deposit-page').style.display = 'none'; }

    function copyNum() {
        let num = document.getElementById('jazzcash-num').innerText;
        navigator.clipboard.writeText(num);
        alert("Number Copied: " + num);
    }

    function submitDeposit() {
        let amt = document.getElementById('dep-amt').value;
        let tid = document.getElementById('dep-tid').value;

        if(amt < 100 || tid.length < 8) {
            alert("Please enter valid Amount (Min 100) and TID!");
            return;
        }

        // Professional Notification
        alert("Request Submitted!\nAmount: PKR " + amt + "\nTID: " + tid + "\nStatus: Processing (10-30 mins)");
        
        // As a demo, adding balance immediately (In real, you verify first)
        wallet += parseFloat(amt);
        document.getElementById('wallet').innerText = wallet.toFixed(2);
        hideDeposit();
    }
</script>

</body>
</html>
