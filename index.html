<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTIMATE VIP CASINO</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Arial', sans-serif; margin: 0; text-align: center; }
        header { background: #1a1a1a; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .balance-box { border: 1px solid var(--gold); padding: 5px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; }
        
        #game-arena { width: 95%; height: 280px; background: radial-gradient(circle, #1a4d1a, #000); margin: 15px auto; border: 3px solid var(--gold); border-radius: 15px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .tile { width: 45px; height: 45px; background: #222; border: 1px solid #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        
        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 20px; border-top: 2px solid var(--gold); }
        input { background: #000; border: 1px solid var(--gold); color: #fff; padding: 10px; width: 120px; text-align: center; border-radius: 5px; font-size: 18px; margin-bottom: 10px; }
        .btn { width: 85%; padding: 15px; border-radius: 50px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; text-transform: uppercase; }
        .btn-play { background: linear-gradient(180deg, #f1c40f, #d4af37); color: #000; }
        .btn-cashout { background: #27ae60; color: white; display: none; }
        
        #plane { font-size: 50px; position: absolute; left: 5%; bottom: 5%; transition: 0.1s linear; }
        #multiplier-display { font-size: 45px; font-weight: bold; position: absolute; top: 10%; color: white; }

        .room-nav { display: flex; gap: 10px; overflow-x: auto; padding: 10px; margin-bottom: 180px; }
        .room-card { min-width: 120px; background: #1a1a1a; padding: 15px; border-radius: 10px; border-bottom: 3px solid var(--gold); font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: var(--gold);">ULTIMATE 777</div>
    <div class="balance-box">PKR <span id="wallet">150.00</span></div>
</header>

<div id="game-arena">
    <div id="display">SELECT GAME ROOM</div>
</div>

<div class="room-nav">
    <div class="room-card" onclick="setRoom('MINES')">💣 MINES</div>
    <div class="room-card" onclick="setRoom('CRASH')">🚀 CRASH</div>
    <div class="room-card" onclick="setRoom('DVT')">🐉 D-TIGER</div>
</div>

<div class="controls">
    <input type="number" id="bet-input" value="10" min="10">
    <button id="play-btn" class="btn btn-play" onclick="startGame()">Start Bet</button>
    <button id="cashout-btn" class="btn btn-cashout" onclick="doCashOut()">Cash Out (<span id="profit-val">0</span>)</button>
</div>

<script>
    let balance = 150;
    let room = "";
    let isPlaying = false;
    let currentBet = 0;
    let currentMult = 1.0;
    let crashInterval;
    let minesOpened = 0;

    function setRoom(r) { room = r; document.getElementById('display').innerText = r + " ROOM READY"; }

    function startGame() {
        let bet = parseFloat(document.getElementById('bet-input').value);
        if (bet < 10 || bet > balance || !room) { alert("Invalid Bet/Room!"); return; }
        
        balance -= bet;
        currentBet = bet;
        isPlaying = true;
        minesOpened = 0;
        currentMult = 1.0;
        updateUI();

        document.getElementById('play-btn').style.display = "none";
        document.getElementById('cashout-btn').style.display = "block";

        if(room === 'MINES') initMines();
        if(room === 'CRASH') initCrash();
    }

    // --- MINES LOGIC ---
    function initMines() {
        let grid = '<div class="mines-grid">';
        for(let i=0; i<25; i++) grid += `<div class="tile" onclick="openTile(this)">?</div>`;
        document.getElementById('game-arena').innerHTML = grid + '</div>';
    }

    function openTile(el) {
        if(!isPlaying || el.innerText !== "?") return;

        if(Math.random() < 0.15) { // 15% Bomb chance
            el.innerHTML = "💣"; el.style.background = "red";
            endGame("BOOM! Bet Lost.");
        } else {
            el.innerHTML = "🪙"; el.style.background = "#1a4d1a";
            minesOpened++;
            // Logic: 1 coin = 1.15x, 6 coins = approx 2x
            currentMult = Math.pow(1.15, minesOpened); 
            updateProfitDisplay();
        }
    }

    // --- CRASH LOGIC ---
    function initCrash() {
        const arena = document.getElementById('game-arena');
        arena.innerHTML = '<div id="plane">✈️</div><div id="multiplier-display">1.00x</div>';
        let plane = document.getElementById('plane');
        let mDisp = document.getElementById('multiplier-display');
        let crashAt = (Math.random() * 4 + 1.1).toFixed(2);

        crashInterval = setInterval(() => {
            currentMult += 0.04;
            mDisp.innerText = currentMult.toFixed(2) + "x";
            plane.style.left = (currentMult * 12) + "%";
            plane.style.bottom = (currentMult * 12) + "%";
            updateProfitDisplay();

            if(currentMult >= crashAt) {
                clearInterval(crashInterval);
                plane.innerText = "💥";
                endGame("Crashed!");
            }
        }, 150);
    }

    function doCashOut() {
        if(!isPlaying) return;
        let win = currentBet * currentMult;
        balance += win;
        alert("Success! Won PKR " + win.toFixed(2));
        endGame();
    }

    function endGame(msg) {
        if(msg) alert(msg);
        isPlaying = false;
        clearInterval(crashInterval);
        document.getElementById('play-btn').style.display = "block";
        document.getElementById('cashout-btn').style.display = "none";
        updateUI();
    }

    function updateUI() { document.getElementById('wallet').innerText = balance.toFixed(2); }
    function updateProfitDisplay() {
        document.getElementById('profit-val').innerText = (currentBet * currentMult).toFixed(1);
    }
</script>

</body>
</html>
