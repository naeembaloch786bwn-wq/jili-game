<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Casino Pro</title>
    <style>
        * { box-sizing: border-box; transition: 0.3s; }
        body { background-color: #000; color: #d4af37; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding-bottom: 80px; }
        header { background: linear-gradient(180deg, #1a1a1a, #000); padding: 20px; border-bottom: 2px solid #d4af37; position: sticky; top: 0; z-index: 100; }
        .balance-card { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 15px; display: inline-block; padding: 15px 40px; margin-top: 15px; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .game-card { background: #111; border: 1px solid #444; border-radius: 12px; padding: 25px 10px; font-weight: bold; cursor: pointer; border-bottom: 4px solid #d4af37; }
        .game-card:active { transform: scale(0.9); background: #d4af37; color: #000; }
        .btn-action { background: linear-gradient(90deg, #d4af37, #f1c40f); color: #000; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; margin: 10px; width: 80%; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(212,175,55,0.4); }
        #status-msg { color: #fff; font-size: 14px; margin: 10px; min-height: 20px; font-weight: bold; }
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 2px solid #d4af37; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; letter-spacing: 2px;">ULTIMATE CASINO PRO</h2>
    <div class="balance-card">
        <p style="margin:0; color: #888; font-size: 11px;">WALLET BALANCE</p>
        <h2 id="balance-display" style="margin:5px 0 0 0;">PKR 150.00</h2>
    </div>
</header>

<div id="status-msg">Welcome, Player! Bet is PKR 20</div>

<div class="game-grid">
    <div class="game-card" onclick="placeBet('Dragon vs Tiger')">🐉<br>Dragon vs Tiger</div>
    <div class="game-card" onclick="placeBet('Mines')">💣<br>Mines</div>
    <div class="game-card" onclick="placeBet('Crash')">🚀<br>Crash</div>
    <div class="game-card" onclick="placeBet('777 Slots')">🎰<br>777 Slots</div>
    <div class="game-card" onclick="placeBet('Roulette')">🎡<br>Roulette</div>
    <div class="game-card" onclick="placeBet('3 Patti')">🃏<br>3 Patti</div>
</div>

<button class="btn-action" onclick="window.location.href='https://wa.me/923289230760'">DEPOSIT / WITHDRAW</button>

<div class="footer-nav">
    <div class="nav-item">HOME</div>
    <div class="nav-item">INVITE</div>
    <div class="nav-item">SUPPORT</div>
    <div class="nav-item">ACCOUNT</div>
</div>

<script>
    let balance = 150;
    const betAmount = 20;
    const winRate = 0.35; // 35% chance to win

    function updateDisplay() {
        document.getElementById('balance-display').innerText = "PKR " + balance.toFixed(2);
    }

    function placeBet(gameName) {
        let status = document.getElementById('status-msg');
        
        if (balance < betAmount) {
            status.style.color = "red";
            status.innerText = "Insufficient Balance! Please Deposit.";
            return;
        }

        // Processing bet
        balance -= betAmount;
        updateDisplay();
        status.style.color = "#d4af37";
        status.innerText = "Playing " + gameName + "...";

        setTimeout(() => {
            // Mathematical Logic: 35% Win vs 65% Loss
            let result = Math.random();

            if (result < winRate) {
                // WINNER (User gets double the bet)
                let winAmount = betAmount * 2;
                balance += winAmount;
                status.style.color = "#00ff00"; // Green for win
                status.innerText = "CONGRATULATIONS! You Won PKR " + winAmount;
            } else {
                // LOSER (User loses the bet)
                status.style.color = "#ff4444"; // Red for loss
                status.innerText = "BET LOST! Better luck next time.";
            }
            updateDisplay();
        }, 1000);
    }
</script>

</body>
</html>
