<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - NAEEM PRO</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; --green: #2ecc71; --red: #e74c3c; --blue: #3498db; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; text-align: center; overflow-x: hidden; }
        header { background: #111; padding: 10px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 500; }
        .bal-box { border: 1.5px solid var(--gold); padding: 5px 12px; border-radius: 20px; color: var(--gold); font-weight: bold; font-size: 14px; }
        #game-arena { width: 92%; height: 230px; background: radial-gradient(circle, #1a3c1a, #000); margin: 10px auto; border: 3px solid var(--gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .main-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; margin-bottom: 220px; }
        .nav-btn { background: #1a1a1a; border-bottom: 3px solid var(--gold); padding: 12px 5px; border-radius: 8px; font-size: 11px; font-weight: bold; color: #ccc; }
        .controls { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px; border-top: 2px solid var(--gold); z-index: 1000; }
        .btn-play { background: var(--gold); color: black; width: 90%; font-size: 18px; font-weight: bold; padding: 12px; border: none; border-radius: 5px; }
        .action-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
        .act-btn { padding: 8px 2px; border-radius: 5px; border: none; font-weight: bold; font-size: 10px; color: white; cursor: pointer; }
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0b0b; z-index: 2000; padding-top: 50px; overflow-y: auto; }
        .form-box { background: #1a1a1a; margin: 15px; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        input { background: #000; border: 1px solid var(--gold); color: #fff; padding: 10px; width: 80%; margin-bottom: 10px; border-radius: 5px; text-align: center; }
        .ref-box { background: #222; border: 1px dashed var(--gold); padding: 10px; margin: 10px 0; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; color: var(--gold);">777 ULTRA</div>
    <div class="bal-box">PKR <span id="wallet">150.00</span></div>
</header>

<div id="game-arena">
    <div id="display-area"><h2>SELECT ROOM</h2></div>
</div>

<div class="main-nav">
    <div class="nav-btn" onclick="setRoom('CRASH')">🚀 CRASH</div>
    <div class="nav-btn" onclick="setRoom('MINES')">💣 MINES</div>
    <div class="nav-btn" onclick="setRoom('DVT')">🐉 D-TIGER</div>
</div>

<div class="controls">
    <button id="btn-play" class="btn-play" onclick="startPlay()">START GAME</button>
    <div class="action-bar">
        <button class="act-btn" style="background:var(--green);" onclick="showPage('dep-page')">DEPOSIT</button>
        <button class="act-btn" style="background:#444;" onclick="showPage('wit-page')">WITHDRAW</button>
        <button class="act-btn" style="background:var(--blue);" onclick="showPage('ref-page')">REFER</button>
        <button class="act-btn" style="background:purple;" onclick="showPage('sup-page')">SUPPORT</button>
    </div>
</div>

<div id="ref-page" class="page">
    <h2>REFER & EARN</h2>
    <div class="form-box">
        <p style="color:var(--gold)">Get <b>PKR 220</b> Bonus!</p>
        <p style="font-size:12px">When your friend deposits 1599+ PKR</p>
        <div class="ref-box" id="ref-link">https://naeem777.com/join?ref=USR8821</div>
        <button onclick="copyRef()" style="background:var(--gold); border:none; padding:10px; width:100%; border-radius:5px; font-weight:bold;">COPY LINK</button>
        <hr style="margin:20px 0; border:0.5px solid #333;">
        <p>Total Referrals: <b id="ref-count">0</b></p>
        <p>Bonus Earned: <b id="ref-bonus">0.00</b></p>
    </div>
    <button onclick="hidePages()" style="color:white; margin-bottom:50px;">BACK TO GAME</button>
</div>

<div id="dep-page" class="page">
    <h2>DEPOSIT</h2>
    <div class="form-box">
        <p>JazzCash: <b>03289230760</b> (Naeem)</p>
        <input type="number" id="d-amt" placeholder="Amount (e.g. 1599)">
        <input type="text" id="d-tid" placeholder="Transaction ID">
        <button class="btn-play" onclick="processDeposit()">SUBMIT DEPOSIT</button>
    </div>
    <button onclick="hidePages()" style="color:white">BACK</button>
</div>

<div id="wit-page" class="page"><h2>WITHDRAW</h2><div class="form-box"><input type="number" placeholder="Number"><input type="number" placeholder="Amount"><button class="btn-play" onclick="hidePages()">SUBMIT</button></div><button onclick="hidePages()" style="color:white">BACK</button></div>
<div id="sup-page" class="page"><h2>SUPPORT</h2><div class="form-box"><button class="btn-play" style="background:#25D366" onclick="window.open('https://wa.me/923289230760')">WhatsApp</button></div><button onclick="hidePages()" style="color:white">BACK</button></div>

<script>
    let wallet = 150;
    let room = "";
    let isPlaying = false;
    let refBonusEarned = 0;
    let refCount = 0;

    // Generate a different Link for every user session
    const uniqueID = "USR" + Math.floor(1000 + Math.random() * 9000);
    document.getElementById('ref-link').innerText = "https://naeem777.com/join?ref=" + uniqueID;

    function showPage(id) { document.getElementById(id).style.display = 'block'; }
    function hidePages() { document.querySelectorAll('.page').forEach(p => p.style.display='none'); }
    function setRoom(r) { room = r; document.getElementById('display-area').innerHTML = `<h2>${r} READY</h2>`; }

    function copyRef() {
        let link = document.getElementById('ref-link').innerText;
        navigator.clipboard.writeText(link);
        alert("Your Unique Referral Link Copied!");
    }

    function processDeposit() {
        let amt = parseFloat(document.getElementById('d-amt').value);
        if(isNaN(amt) || amt < 100) { alert("Invalid Amount!"); return; }

        // AUTOMATIC REFERRAL BONUS LOGIC
        if(amt >= 1599) {
            refCount++;
            refBonusEarned += 220;
            wallet += 220; // Auto add bonus to balance
            document.getElementById('ref-count').innerText = refCount;
            document.getElementById('ref-bonus').innerText = refBonusEarned.toFixed(2);
            alert("CONGRATS! Referral Bonus PKR 220 Added to your wallet!");
        }

        wallet += amt;
        updateUI();
        alert("Deposit of " + amt + " submitted successfully!");
        hidePages();
    }

    function startPlay() {
        if(!room || isPlaying) return;
        let bet = parseFloat(document.getElementById('bet-input')?.value || 10);
        if(bet > wallet) { alert("Low Balance!"); return; }
        // Game start logic here (already in your engine)
        alert("Game starting in " + room);
    }

    function updateUI() { document.getElementById('wallet').innerText = wallet.toFixed(2); }
</script>
</body>
</html>
