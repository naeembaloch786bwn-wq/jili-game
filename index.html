<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saleem Elite Games</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #0b0e18; --card: #1c2230; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; text-align: center; }
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        .balance-box { background: #000; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }
        .game-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .game-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: var(--gold); transform: scale(1.05); }
        .btn { background: var(--gold); color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        input { padding: 10px; margin: 5px; width: 250px; border-radius: 5px; border: 1px solid #444; background: #161b29; color: white; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h1 style="color: var(--gold);">SALEEM ELITE</h1>
        <input type="email" id="email" placeholder="Gmail Address">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn" onclick="handleAuth('login')">Login</button>
        <button class="btn" onclick="handleAuth('register')" style="background:transparent; color:white; margin-top:10px;">Create New Account</button>
    </div>

    <div class="header">
        <div id="user-name">Guest</div>
        <div class="balance-box">PKR <span id="user-balance">0.00</span></div>
        <button onclick="logout()" style="background:red; color:white; border:none; border-radius:5px; padding:5px 10px;">Logout</button>
    </div>

    <div class="game-container">
        <div class="game-card" onclick="alert('Starting Crash...')">🚀 CRASH<br><small>Auto: 1.25x Min</small></div>
        <div class="game-card" onclick="alert('Starting Slots...')">🎰 SLOTS<br><small>Auto Spin Ready</small></div>
        <div class="game-card" onclick="alert('Starting Dragon Tiger...')">🐉 DRAGON TIGER<br><small>Professional</small></div>
        <div class="game-card" onclick="alert('Starting Mines...')">💣 MINES<br><small>Real System</small></div>
    </div>

    <div style="padding: 20px;">
        <button class="btn" style="width: 45%;" onclick="alert('Deposit via Admin')">Deposit</button>
        <button class="btn" style="width: 45%; background: #24d15d;" onclick="alert('Withdraw logic')">Withdraw</button>
    </div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-a-eO1LKw1fUixVSjDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.firebasestorage.app",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e641fc2e337"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // 1. Authentication Logic
    function handleAuth(type) {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;

        if(type === 'register') {
            auth.createUserWithEmailAndPassword(email, pass).then(res => {
                // Welcome Bonus 120 set for new user
                db.ref('users/' + res.user.uid).set({
                    email: email,
                    balance: 120,
                    welcomeBonus: true,
                    totalWagered: 0
                });
                alert("Account Created! 120 Bonus Added.");
            }).catch(e => alert(e.message));
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }
    }

    // 2. Track User & Balance
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            db.ref('users/' + user.uid).on('value', snap => {
                const data = snap.val();
                if(data) {
                    document.getElementById('user-balance').innerText = data.balance.toFixed(2);
                    document.getElementById('user-name').innerText = data.email.split('@')[0];
                }
            });
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    function logout() {
        auth.signOut();
    }

    // 3. Auto-Cashout Protection Logic
    function setAutoCashout(value) {
        if(value < 1.25) {
            alert("Auto-cashout cannot be less than 1.25x");
            return 1.25;
        }
        return value;
    }

</script>
</body>
</html>
