<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - NAEEM PRO CASINO</title>
    <style>
        :root { --gold: #f1c40f; --bg: #0a0a0a; --card-w: 75px; --card-h: 110px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(45deg, #000, #1a0033, #000); color: white; font-family: 'Arial Black', sans-serif; overflow-x: hidden; user-select: none; }
        
        /* Header */
        header { background: linear-gradient(90deg, #111, #333); padding: 12px; border-bottom: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(241,196,15,0.3); }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(45deg, var(--gold), #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px var(--gold); }
        .bal-box { border: 2px solid var(--gold); padding: 8px 15px; border-radius: 25px; font-weight: bold; background: rgba(241, 196, 15, 0.15); display: flex; align-items: center; gap: 10px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 10px var(--gold);} 50%{box-shadow:0 0 25px var(--gold);} }
        .logout-btn { background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .logout-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(231,76,60,0.5); }
        
        /* Game Arena */
        #game-arena { width: 95%; height: 320px; margin: 15px auto; background: radial-gradient(circle, #1a1a2e 0%, #16213e 50%, #0f0f23 100%); border-radius: 20px; display: flex; align-items: center; justify-content: center; position: relative; border: 3px solid var(--gold); box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        
        /* Main Navigation */
        .main-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 95%; margin: 15px auto; }
        .nav-btn { background: linear-gradient(145deg, #2a2a2a, #1a1a1a); border: 2px solid #444; padding: 20px 10px; text-align: center; cursor: pointer; font-size: 16px; font-weight: 900; border-radius: 15px; transition: all 0.3s; }
        .nav-btn:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 15px 40px rgba(241,196,15,0.4); }

        /* Controls */
        .controls { position: fixed; bottom: 0; width: 100%; background: linear-gradient(180deg, #111, #000); padding: 20px; border-top: 3px solid var(--gold); box-shadow: 0 -10px 30px rgba(0,0,0,0.8); z-index: 50; }
        input[type=number] { background: linear-gradient(145deg, #1a1a1a, #111); border: 2px solid #444; color: var(--gold); padding: 15px; width: 100%; margin-bottom: 10px; border-radius: 12px; text-align: center; font-size: 20px; font-weight: bold; }
        .btn-play { background: linear-gradient(45deg, var(--gold), #ffd700); color: #000; border: none; padding: 15px; width: 100%; font-weight: 900; border-radius: 15px; cursor: pointer; font-size: 20px; }

        /* Pages */
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .form-box { background: linear-gradient(145deg, #1a1a1a, #111); padding: 30px 25px; border-radius: 20px; width: 90%; max-width: 400px; border: 2px solid var(--gold); text-align: center; }
        
        /* Auth Overlay */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0.95), rgba(26,0,51,0.95)); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body onload="initApp()">

<div id="auth-overlay">
    <div class="form-box">
        <h2 id="auth-title" style="color:var(--gold); font-size: 32px; margin-bottom: 20px;">🔥 LOGIN 🔥</h2>
        <div id="reg-fields" style="display:none;">
            <input type="text" id="user-in" placeholder="👤 Full Name" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; border:1px solid #444; background:#111; color:white;">
        </div>
        <input type="tel" id="phone-in" placeholder="📱 Phone Number" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; border:1px solid #444; background:#111; color:white;">
        <input type="password" id="pass-in" placeholder="🔒 Password" style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; border:1px solid #444; background:#111; color:white;">
        <button class="btn-play" onclick="handleAuth()">🚀 ENTER CASINO</button>
        <p id="toggle-text" onclick="toggleAuth()" style="font-size:14px; margin-top:25px; cursor:pointer; color:var(--gold); text-decoration: underline;">New? Register Here ➕</p>
    </div>
</div>

<header>
    <div class="logo">🎰 NAEEM PRO</div>
    <div class="bal-box">
        <span>💰 PKR <span id="wallet">0.00</span></span>
        <button class="logout-btn" onclick="logout()">❌</button>
    </div>
</header>

<div id="game-arena">
    <div id="display-area"><h2 style="font-size:24px;">🎮 SELECT A GAME</h2></div>
</div>

<div class="main-nav" id="main-nav"></div>

<div class="controls">
    <input type="number" id="bet-input" value="100">
    <button id="btn-play" class="btn-play" onclick="startGame()">🎯 START GAME</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTNneivrTLe-s-eO1LKw1fUvsVsJDfu2k", authDomain: "pattipro-c1ffe.firebaseapp.com", databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com", projectId: "pattipro-c1ffe", storageBucket: "pattipro-c1ffe.appspot.com", messagingSenderId: "766843054614", appId: "1:766843054614:web:781658832e63e41fc2e337" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = true;
    let wallet = 0;
    let activeUser = localStorage.getItem("activeUser");

    function initApp() {
        if(activeUser) checkAuth();
        loadGames();
    }

    function toggleAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "🔥 LOGIN 🔥" : "🔥 REGISTER 🔥";
        document.getElementById('reg-fields').style.display = isLoginMode ? "none" : "block";
        document.getElementById('toggle-text').innerText = isLoginMode ? "New? Register Here ➕" : "Already have account? Login 🔑";
    }

    function handleAuth() {
        let phone = document.getElementById('phone-in').value;
        let pass = document.getElementById('pass-in').value;
        let name = document.getElementById('user-in').value;

        if(!phone || !pass) return alert("Please fill all fields");

        if(isLoginMode) {
            db.ref('users/' + phone).once('value', snapshot => {
                if(snapshot.exists() && snapshot.val().password === pass) {
                    localStorage.setItem("activeUser", phone);
                    location.reload();
                } else alert("Invalid Login Details");
            });
        } else {
            db.ref('users/' + phone).set({
                username: name || "Player",
                password: pass,
                balance: 100
            }).then(() => {
                alert("Registered! Now Login.");
                location.reload();
            });
        }
    }

    function checkAuth() {
        db.ref('users/' + activeUser).on('value', snapshot => {
            if(snapshot.exists()) {
                wallet = snapshot.val().balance;
                document.getElementById('wallet').innerText = wallet.toFixed(2);
                document.getElementById('auth-overlay').style.display = 'none';
            }
        });
    }

    function loadGames() {
        const games = ["SPIN", "MINES", "CRASH", "DICE"];
        document.getElementById('main-nav').innerHTML = games.map(g => `<div class="nav-btn" onclick="alert('Game Started: '+ '${g}')">${g}</div>`).join('');
    }

    function logout() {
        localStorage.removeItem("activeUser");
        location.reload();
    }
</script>
</body>
</html>
