<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP CASINO - 777 ENGINE</title>
    <style>
        :root { --gold: #f1c40f; --dark: #0a0a0a; --green: #2ecc71; }
        body { background: var(--dark); color: white; font-family: 'Arial', sans-serif; margin: 0; text-align: center; user-select: none; }
        header { background: #1a1a1a; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .balance-box { border: 2px solid var(--gold); padding: 5px 15px; border-radius: 20px; font-weight: bold; color: var(--gold); box-shadow: 0 0 10px rgba(241,196,15,0.2); }
        
        /* Game Screen */
        #game-screen { width: 95%; height: 280px; background: radial-gradient(circle, #1a4d1a, #000); margin: 15px auto; border: 3px solid var(--gold); border-radius: 15px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* Mines Grid */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .tile { width: 48px; height: 48px; background: #222; border: 1px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: 0.2s; }
        .tile:active { transform: scale(0.9); }

        /* Crash Elements */
        #plane { font-size: 55px; position: absolute; left: 5%; bottom: 5%; transition: 0.1s linear; filter: drop-shadow(0 0 10px gold); }
        #multiplier-val { font-size: 50px; font-weight: 900; position: absolute; top: 15%; text-shadow: 0 0 20px black; }

        /* Controls */
        .bottom-panel { position: fixed; bottom: 0; width: 100%; background: #111; padding: 20px; border-top: 2px solid var(--gold); box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .input-area { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
        input { background: #000; border: 1px solid var(--gold); color: #fff; padding: 12px; width: 130px; text-align: center; border-radius: 8px; font-size: 20px; font-weight: bold; }
        
        .btn { width: 90%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; font-size: 20px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-bet { background: linear-gradient(180deg, #f1c40f, #d4af37); color: #000; box-shadow: 0 4px 15px rgba(241,196,15,0.4); }
        .btn-cashout { background: linear-gradient(180deg, #2ecc71, #27ae60); color: white; display: none; box-shadow: 0 4px 15px rgba(46,204,113,0.4); }

        /* History */
        .history-bar { display: flex; gap: 5px; justify-content: center; margin-top: 5px; font-size: 10px; color: #888; }
        .history-item { background: #222; padding: 2px 8px; border-radius: 10px; border: 1px solid #444; }

        .game-tabs { display: flex; gap: 10px; overflow-x: auto; padding: 10px; margin-bottom: 190px; }
        .tab { min-width: 130px; background: #1a1a1a; padding: 15px; border-radius: 12px; border-bottom: 4px solid var(--gold); }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; letter-spacing: 1px; color: var(--gold);">ULTIMATE 777 ROOM</div>
    <div class="balance-box">PKR <span id="wallet">150.00</span></div>
</header>

<div id="game-screen">
    <div id="display-area">SELECT A ROOM TO START</div>
</div>

<div class="history-bar" id="history">
    <span class="history-item">1.22x</span><span class="history-item">5.40x</span><span class="history-item">1.02x</span>
</div>

<div class="game-tabs">
    <div class="tab" onclick="changeRoom('MINES')">💣 MINES</div>
    <div class="tab" onclick="changeRoom('CRASH')">🚀 CRASH</div>
    <div class="tab" onclick="changeRoom('DVT')">🐉 D-TIGER</div>
</div>

<div class="bottom-panel">
    <div class="input-area">
        <input type="number" id="bet-input" value="10" min="10">
    </div>
    <button id="btn-bet" class="btn btn-bet" onclick="handleStart()">START BET</button>
    <button id="btn-cashout" class="btn btn-cashout" onclick="handleCashout()">CASH OUT (PKR <span id="profit">0</span>)</button>
</div>

<script>
    let balance = 150;
    let room = "";
    let isPlaying = false;
    let betAmount = 0;
    let mult = 1.0;
    let crashTimer;
    let minesCount = 0;

    function changeRoom(r) {
        room = r;
        document.getElementById('display-area').innerHTML = `<h2 style='color:var(--gold)'>${r} ROOM</h2><p>Place your bet!</p>`;
    }

    function handleStart() {
        let val = parseFloat(document.getElementById('bet-input').value);
        if (!room) { alert("Select a Room!"); return; }
        if (val < 10 || val > balance) { alert("Check Balance!"); return; }

        balance -= val;
        betAmount = val;
        isPlaying = true;
        mult = 1.0;
        minesCount = 0;
        updateUI();

        document.getElementById('btn-bet').style.display = "none";
        document.getElementById('btn-cashout').style.display = "block";

        if (room === 'CRASH') startCrashGame();
        if (room === 'MINES') startMinesGame();
    }

    // --- PROFESSSIONAL MINES LOGIC ---
    function startMinesGame() {
        let grid = '<div class="mines-grid">';
        for (let i = 0; i < 25; i++) grid += `<div class="tile" onclick="revealMine(this)">?</div>`;
        document.getElementById('game-screen').innerHTML = grid + '</div>';
    }

    function revealMine(el) {
        if (!isPlaying || el.innerText !== "?") return;

        if (Math.random() < 0.12) { // Asal 3Patti logic: Low bomb chance initially
            el.innerHTML = "💣"; el.style.background = "#e74c3c";
            finishGame("BOOM! LOST");
        } else {
            el.innerHTML = "🪙"; el.style.background = "#1e5d1e";
            minesCount++;
            // Har coin par multiplier ka formula: 1.15^coins
            mult = Math.pow(1.18, minesCount); 
            updateProfit();
        }
    }

    // --- PROFESSIONAL CRASH LOGIC ---
    function startCrashGame() {
        const screen = document.getElementById('game-screen');
        screen.innerHTML = '<div id="plane">✈️</div><div id="multiplier-val">1.00x</div>';
        let plane = document.getElementById('plane');
        let mText = document.getElementById('multiplier-val');
        
        let crashPoint = (Math.random() < 0.3) ? 1.05 : (Math.random() * 5 + 1.1).toFixed(2);

        crashTimer = setInterval(() => {
            mult += 0.04;
            mText.innerText = mult.toFixed(2) + "x";
            plane.style.left = (mult * 10) + "%";
            plane.style.bottom = (mult * 10) + "%";
            updateProfit();

            if (mult >= crashPoint) {
                clearInterval(crashTimer);
                plane.innerText = "💥";
                finishGame("CRASHED!");
            }
        }, 120);
    }

    function handleCashout() {
        if (!isPlaying) return;
        let win = betAmount * mult;
        balance += win;
        alert("SUCCESS! Cashed Out: PKR " + win.toFixed(2));
        addHistory(mult.toFixed(2) + "x");
        finishGame();
    }

    function finishGame(msg) {
        if (msg) alert(msg);
        isPlaying = false;
        clearInterval(crashTimer);
        document.getElementById('btn-bet').style.display = "block";
        document.getElementById('btn-cashout').style.display = "none";
        updateUI();
    }

    function updateUI() { document.getElementById('wallet').innerText = balance.toFixed(2); }
    function updateProfit() { document.getElementById('profit').innerText = (betAmount * mult).toFixed(1); }
    function addHistory(val) {
        let h = document.getElementById('history');
        h.innerHTML = `<span class="history-item" style="color:var(--gold)">${val}</span>` + h.innerHTML;
    }
</script>

</body>
</html>
