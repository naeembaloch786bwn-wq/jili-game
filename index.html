<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Casino Pro</title>
    <style>
        * { box-sizing: border-box; transition: 0.3s; }
        body { background-color: #000; color: #d4af37; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding-bottom: 100px; overflow-x: hidden; }
        header { background: #111; padding: 15px; border-bottom: 2px solid #d4af37; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        .balance-section { margin: 15px 0; }
        .balance-card { background: linear-gradient(145deg, #1a1a1a, #000); border: 2px solid #d4af37; border-radius: 12px; display: inline-block; padding: 10px 30px; min-width: 200px; }

        /* Betting Input Area */
        .bet-area { background: #1a1a1a; padding: 15px; margin: 10px; border-radius: 10px; border: 1px solid #333; }
        input[type="number"] { background: #000; border: 1px solid #d4af37; color: #fff; padding: 10px; border-radius: 5px; width: 60%; font-size: 18px; text-align: center; margin-bottom: 10px; }
        
        /* Game Screen Simulation */
        #game-screen { background: #0b2d0b; border: 3px solid #d4af37; height: 180px; margin: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; overflow: hidden; }
        .card-anim { font-size: 50px; position: absolute; }

        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .game-card { background: #111; border: 1px solid #444; border-radius: 10px; padding: 15px; cursor: pointer; border-bottom: 3px solid #d4af37; font-size: 13px; }
        .game-card.active { border-color: #fff; background: #222; }

        .btn-play { background: linear-gradient(90deg, #d4af37, #f1c40f); color: #000; border: none; padding: 15px; width: 80%; border-radius: 30px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 15px rgba(212,175,55,0.4); margin-top: 10px; }
        
        .footer-nav { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #d4af37; z-index: 1000; }
    </style>
</head>
<body>

<header>
    <h3 style="margin:0;">ULTIMATE CASINO</h3>
</header>

<div class="balance-section">
    <div class="balance-card">
        <p style="margin:0; font-size: 11px; color: #888;">BALANCE</p>
        <h2 id="balance-display" style="margin:5px 0 0 0;">PKR 150.00</h2>
    </div>
</div>

<div id="game-screen">
    <div id="display-text">SELECT GAME & BET</div>
</div>

<div class="bet-area">
    <label style="display:block; font-size: 12px; margin-bottom: 5px;">ENTER BET AMOUNT (Min: 10)</label>
    <input type="number" id="bet-input" value="10" min="10">
    <button class="btn-play" onclick="startGame()">START GAME</button>
</div>

<div class="game-grid">
    <div class="game-card" onclick="selectGame(this, 'Dragon vs Tiger')">🐉 Dragon vs Tiger</div>
    <div class="game-card" onclick="selectGame(this, 'Mines')">💣 Mines</div>
    <div class="game-card" onclick="selectGame(this, 'Crash')">🚀 Crash</div>
    <div class="game-card" onclick="selectGame(this, '777 Slots')">🎰 777 Slots</div>
</div>

<div class="footer-nav">
    <div onclick="window.location.href='https://wa.me/923289230760'">DEPOSIT</div>
    <div onclick="alert('Saleem: 03289230760')">WITHDRAW</div>
</div>

<script>
    let balance = 150;
    let selectedGame = "";
    const winRate = 0.35; // 35% Win, 65% Loss

    function selectGame(el, name) {
        document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        selectedGame = name;
        document.getElementById('display-text').innerText = "Playing: " + name;
    }

    function startGame() {
        let betInput = document.getElementById('bet-input');
        let bet = parseInt(betInput.value);
        let screen = document.getElementById('display-text');

        if (!selectedGame) { alert("Please select a game first!"); return; }
        if (isNaN(bet) || bet < 10) { alert("Minimum bet is PKR 10"); return; }
        if (bet > balance) { alert("Insufficient Balance!"); return; }

        // Deduct Bet
        balance -= bet;
        updateDisplay();
        screen.innerText = "Dealing Cards...";

        // Real Feeling Delay
        setTimeout(() => {
            let win = Math.random() < winRate;

            if (win) {
                let prize = bet * 1.9; // 1.9x profit (Professional standard)
                balance += prize;
                screen.innerHTML = "<span style='color:#00ff00'>YOU WON!<br>PKR " + prize.toFixed(2) + "</span>";
            } else {
                screen.innerHTML = "<span style='color:#ff4444'>HOUSE WINS!<br>Try Again</span>";
            }
            updateDisplay();
        }, 2000);
    }

    function updateDisplay() {
        document.getElementById('balance-display').innerText = "PKR " + balance.toFixed(2);
    }
</script>

</body>
</html>
