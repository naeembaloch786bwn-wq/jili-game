<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Patti Pro - Live Games</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --yellow: #fcd535; --green: #2ebd85; --red: #f6465d; --text: #eaecef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .page { display: none; padding: 20px; min-height: 100vh; }
        .active { display: block; }
        .header { background: #181a20; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--yellow); }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .g-card { background: var(--card); padding: 25px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #2b3139; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 10px; background: #2b3139; border: 1px solid #474d57; border-radius: 5px; color: white; margin: 10px 0; }
        /* Mines Board */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 15px 0; }
        .tile { aspect-ratio: 1; background: #2b3139; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="page-login" class="page active">
        <h2 style="text-align:center; color:var(--yellow); margin-top:50px;">3Patti Pro</h2>
        <input type="email" id="l-email" placeholder="Email">
        <input type="password" id="l-pass" placeholder="Password">
        <button class="btn" style="background:var(--yellow)" onclick="login()">LOGIN</button>
    </div>

    <div id="page-dash" class="page" style="padding:0;">
        <div class="header">
            <span id="u-email" style="font-size:12px;">User</span>
            <span style="color:var(--yellow)">PKR <b id="u-bal">0.00</b></span>
        </div>
        <div style="padding:20px;">
            <div class="game-grid">
                <div class="g-card" onclick="showPage('page-mines')">💣<br>MINES</div>
                <div class="g-card" onclick="showPage('page-crash')">🚀<br>CRASH</div>
                <div class="g-card" onclick="showPage('page-dt')">🐯<br>DRAGON TIGER</div>
            </div>
            <button class="btn" style="background:var(--red); margin-top:30px;" onclick="auth.signOut()">LOGOUT</button>
        </div>
    </div>

    <div id="page-mines" class="page">
        <button onclick="showPage('page-dash')">← EXIT</button>
        <div class="grid" id="m-board"></div>
        <input type="number" id="m-bet" placeholder="Bet Amount">
        <button class="btn" id="m-start" style="background:var(--yellow)" onclick="startMines()">START</button>
        <button class="btn" id="m-cash" style="background:var(--green); display:none;" onclick="cashMines()">CASHOUT</button>
    </div>

    <script>
        // API KEY & CONFIG FROM SCREENSHOT
        const firebaseConfig = {
            apiKey: "AIzaSyDTNneivrTie-a-e0ilKwifU",
            authDomain: "pattipro-clffe.firebaseapp.com",
            projectId: "pattipro-clffe",
            storageBucket: "pattipro-clffe.appspot.com",
            messagingSenderId: "766843054614",
            appId: "1:766843054614:web:781658832e63e4ffc2c337"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let uData = null;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function login() {
            const e = document.getElementById('l-email').value, p = document.getElementById('l-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', s => {
                    uData = s.val();
                    document.getElementById('u-email').innerText = uData.email;
                    document.getElementById('u-bal').innerText = uData.balance.toFixed(2);
                    showPage('page-dash');
                });
            } else { showPage('page-login'); }
        });

        // Mines Logic (Asli Wala)
        let mActive = false, mList = [], mBet = 0, mMult = 1.0;
        function startMines() {
            mBet = parseFloat(document.getElementById('m-bet').value);
            if(mBet > uData.balance || mBet < 20) return alert("Low Balance");
            db.ref('users/' + auth.currentUser.uid).update({ balance: uData.balance - mBet });
            mActive = true; mList = []; mMult = 1.0;
            while(mList.length < 3) { let r = Math.floor(Math.random()*25); if(!mList.includes(r)) mList.push(r); }
            const b = document.getElementById('m-board'); b.innerHTML = '';
            for(let i=0; i<25; i++) {
                let t = document.createElement('div'); t.className = 'tile';
                t.onclick = () => {
                    if(!mActive || t.innerHTML) return;
                    if(mList.includes(i)) { 
                        t.innerHTML='💣'; t.style.background='red'; mActive=false; 
                        alert("BOMB! Loss."); showPage('page-dash'); 
                    } else { 
                        t.innerHTML='💎'; t.style.background='green'; mMult += 0.4; 
                        document.getElementById('m-cash').innerText=`CASHOUT ${(mBet*mMult).toFixed(1)}`;
                    }
                };
                b.appendChild(t);
            }
            document.getElementById('m-start').style.display='none';
            document.getElementById('m-cash').style.display='block';
        }
        function cashMines() {
            db.ref('users/' + auth.currentUser.uid).update({ balance: uData.balance + (mBet*mMult) });
            alert("Win!"); showPage('page-dash');
            document.getElementById('m-start').style.display='block';
            document.getElementById('m-cash').style.display='none';
        }
    </script>
</body>
</html>
