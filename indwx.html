  .action-bar {
    display: grid;

  /* Pages */
  .page {

</style>

<script>
// --- User & Wallet Simulation ---
let activeUser = null;
const usersDB = {}; // Simulated DB

const GAMES = [];
// 3 Crash Games with exact rates
for(let i=1; i<=3; i++) {
  GAMES.push({
    id: `CRASH${i}`,
    name: `Crash Game #${i}`,
    icon: "🚀",
    payout: 2,
    winRate: 0.40,
    lossRate: 0.58,
    equalRate: 0.02
  });
}
// Add 47 dummy other games similar style
for(let i=4; i<=50; i++) {
  const winR = (Math.random()*0.5)+0.2; // 20%-70%
  const lossR = 1 - winR - 0.02;
  GAMES.push({
    id: `GAME${i}`,
    name: `Casino Game #${i}`,
    icon: "🎮",
    payout: Math.round((1/winR)*1.1*10)/10,
    winRate: winR,
    lossRate: lossR,
    equalRate: 0.02
  });
}

let wallet = 0, currentGame = null;
let isPlaying = false;
let bet = 0;

function initApp() {
  checkAuth();
  loadGames();
  updateWallet(0);
}

function updateWallet(value) {
  wallet = value;
  document.getElementById('wallet').innerText = wallet.toFixed(2);
}

function checkAuth() {
  // load active user from localStorage
  let stored = localStorage.getItem("activeUser");
  if(stored && usersDB[stored]){
    activeUser = stored;
    updateWallet(usersDB[activeUser].balance);
    document.getElementById('auth-overlay').style.display = 'none';
  } else {
    document.getElementById('auth-overlay').style.display = 'flex';
  }
}

function toggleAuth() {
  const regFields = document.getElementById('reg-fields');
  if(regFields.style.display === "none" || regFields.style.display === ""){
    regFields.style.display = "block";
  } else {
    regFields.style.display = "none";
  }
}

function handleAuth(){
  const phone = document.getElementById('phone-in').value.trim();
  const pass = document.getElementById('pass-in').value.trim();
  const username = "Naeem"; // fixed name for deposit number

  if(!phone || !pass){
    alert('⚠️ Please fill all fields!');
    return;
  }

  const regFields = document.getElementById('reg-fields');
  if(regFields.style.display === "block"){
    // Registration
    if(usersDB[phone]){
      alert("📛 User already exists. Please login!");
      return;
    }
    usersDB[phone] = {username, password: pass, balance: 100, joined: Date.now()};
    alert("✅ Registered! Welcome bonus: 100 PKR");
    saveLogin(phone);
  } else {
    // Login
    if(usersDB[phone] && usersDB[phone].password === pass){
      saveLogin(phone);
    } else {
      alert("❌ Invalid credentials!");
    }
  }
}

function saveLogin(phone) {
  activeUser = phone;
  localStorage.setItem("activeUser", phone);
  document.getElementById('auth-overlay').style.display = 'none';
  updateWallet(usersDB[activeUser].balance);
}

// LOGOUT
function logout(){
  activeUser = null;
  localStorage.removeItem("activeUser");
  document.getElementById('auth-overlay').style.display = 'flex';
  currentGame = null;
  updateWallet(0);
  document.getElementById('display-area').innerHTML = `<h2>🎮 SELECT YOUR GAME</h2>`;
}

// LOAD GAMES NAVIGATION
function loadGames(){
  let nav = document.getElementById("main-nav");
  nav.innerHTML = GAMES.map(g=>`
    <div class="nav-btn" onclick="setGame('${g.id}')">
      <div style="font-size:32px;margin-bottom:5px;">${g.icon}</div>
      ${g.name}
    </div>
  `).join('');
}

// SET GAME
function setGame(id){
  let game = GAMES.find(g=>g.id===id);
  if(!game) return;
  currentGame = game;

  // Highlight active button
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.remove("active");
    if(btn.textContent.includes(game.name)) btn.classList.add("active");
  });

  document.getElementById("display-area").innerHTML = `
    <div style="text-align:center;">
      <div style="font-size:48px;margin-bottom:10px;">${game.icon}</div>
      <h2 style="font-size:24px;margin:10px 0;color:var(--gold);text-shadow:0 0 20px var(--gold);">${game.name}</h2>
      <p style="color:#ccc;font-size:14px;">Payout: ${game.payout}x | Win Rate: ${(game.winRate*100).toFixed(0)}% | Loss Rate: ${(game.lossRate*100).toFixed(0)}% | Draw Rate: ${(game.equalRate*100).toFixed(0)}%</p>
    </div>
  `;
}

// BET BUTTONS
function setBet(amount){
  document.getElementById('bet-input').value = amount;
}

// START GAME
function startGame(){
  if(!currentGame){
    alert("❗ Please select a game");
    return;
  }
  bet = parseFloat(document.getElementById('bet-input').value);
  if(bet < 10){
    alert("❌ Minimum bet is ₹10");
    return;
  }
  if(bet > wallet){
    alert("❌ Insufficient balance");
    return;
  }
  if(isPlaying){
    alert("⏳ Game is already running");
    return;
  }
  isPlaying = true;
  // Deduct bet
  wallet -= bet;
  updateWallet(wallet);

  // Simulate game result using game rates
  const roll = Math.random();
  let resultText = "";
  if(roll < currentGame.winRate){
    // WIN
    let payout = bet * currentGame.payout;
    wallet += payout;
    resultText = `🎉 You WON ₹${payout.toFixed(2)}!`;
  } else if(roll < currentGame.winRate + currentGame.equalRate){
    // DRAW
    wallet += bet; // Bet refunded
    resultText = "⚖️ It's a DRAW! Bet returned.";
  } else {
    // LOSE
    resultText = "😢 You LOST! Better luck next time.";
  }
  updateWallet(wallet);
  addToHistory(currentGame.name, resultText);
  showResult(resultText);
  isPlaying = false;
}

function addToHistory(name, result){
  const container = document.getElementById("hist-row");
  let div = document.createElement("div");
  div.className = "h-item";
  div.style.background = "var(--gold)";
  div.style.color = "#000";
  div.style.padding = "5px 15px";
  div.style.borderRadius = "15px";
  div.style.fontWeight = "bold";
  div.style.fontSize = "14px";
  div.textContent = `${name}: ${result}`;
  container.prepend(div);

  // Keep max 10 items
  if(container.children.length > 10) {
    container.removeChild(container.children[container.children.length -1]);
  }
}

function showResult(text){
  const display = document.getElementById("display-area");
  let html = display.innerHTML;
  display.innerHTML = html + `<p style="margin-top:10px; font-size:18px; font-weight:bold; color: var(--gold); text-align:center;">${text}</p>`;
}

// Show/hide pages (deposit, withdraw, etc)
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>{
    if(p.id === id) p.classList.add("active");
    else p.classList.remove("active");
  });
}
function hidePages(){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
}

// Deposit
function doDeposit(){
  const amt = parseFloat(document.getElementById("d-amt").value);
  const tid = document.getElementById("d-tid").value.trim();
  const depRec = document.getElementById("dep-records");
  if(!activeUser){
    alert("Login first!");
    return;
  }
  if(!amt || amt <10){
    alert("Minimum deposit ₹10");
    return;
  }
  if(!tid){
    alert("Transaction ID required");
    return;
  }

  // For simplicity accept deposit immediately and add to wallet.
  wallet += amt;
  updateWallet(wallet);
  usersDB[activeUser].balance = wallet;

  // Record deposit details on screen
  let rec = document.createElement("div");
  rec.textContent = `₹${amt.toFixed(2)} deposited. TID: ${tid}`;
  rec.style.borderTop = "1px solid #444";
  rec.style.paddingTop = "5px";
  depRec.prepend(rec);

  // Clear inputs
  document.getElementById("d-amt").value = "";
  document.getElementById("d-tid").value = "";

  alert("✅ Deposit successful!");
}

// Withdraw
function doWithdraw(){
  const amt = parseFloat(document.getElementById("w-amt").value);
  const witRec = document.getElementById("wit-records");
  if(!activeUser){
    alert("Login first!");
    return;
  }
  if(!amt || amt <10){
    alert("Minimum withdrawal ₹10");
    return;
  }
  if(amt > wallet){
    alert("Insufficient balance");
    return;
  }

  wallet -= amt;
  updateWallet(wallet);
  usersDB[activeUser].balance = wallet;

  let rec = document.createElement("div");
  rec.textContent = `₹${amt.toFixed(2)} withdrawal requested. Please wait for processing.`;
  rec.style.borderTop = "1px solid #444";
  rec.style.paddingTop = "5px";
  witRec.prepend(rec);

  document.getElementById("w-amt").value = "";
  alert("✅ Withdrawal requested!");
}

  if(!activeUser){
    alert("Login first!");
    return;
  }
  const referLink = `${window.location.href}?ref=${activeUser}`;
  navigator.clipboard.writeTe
