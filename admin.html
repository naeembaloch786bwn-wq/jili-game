<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - ADMIN PANEL</title>
    <style>
        body { background: #0a0a0a; color: #f1c40f; font-family: sans-serif; padding: 10px; margin:0; }
        h1 { text-align: center; border-bottom: 2px solid #f1c40f; padding: 15px; font-size: 18px; margin:0; background:#111; }
        .section { background: #111; padding: 10px; border-radius: 8px; margin: 15px 5px; border: 1px solid #333; }
        .section-title { font-weight: bold; margin-bottom: 10px; display: block; color: #fff; border-left: 4px solid #f1c40f; padding-left: 10px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; color: #ccc; }
        th, td { border: 1px solid #222; padding: 10px 5px; text-align: left; word-break: break-all; }
        th { background: #1a1a1a; color: #f1c40f; }
        .btn-app { background: #27ae60; color: white; border: none; padding: 6px; border-radius: 3px; cursor: pointer; font-size: 9px; font-weight: bold; }
        .btn-rej { background: #e74c3c; color: white; border: none; padding: 6px; border-radius: 3px; cursor: pointer; font-size: 9px; font-weight: bold; margin-top: 2px; }
        input[type="number"] { background: #000; border: 1px solid #444; color: #fff; width: 50px; padding: 5px; border-radius: 3px; font-size: 10px; }
        .add-btn { background: #f1c40f; color: #000; border: none; padding: 5px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<h1>777 ULTRA - ADMIN PANEL</h1>

<div class="section">
    <span class="section-title">🎂 Pending Deposits</span>
    <table>
        <thead><tr><th>PHONE</th><th>AMT</th><th>METHOD</th><th>TID</th><th>ACTION</th></tr></thead>
        <tbody id="dep-list"></tbody>
    </table>
</div>

<div class="section">
    <span class="section-title">🎂 Pending Withdrawals</span>
    <table>
        <thead><tr><th>PHONE</th><th>AMT</th><th>METHOD</th><th>TARGET</th><th>ACTION</th></tr></thead>
        <tbody id="wit-list"></tbody>
    </table>
</div>

<div class="section">
    <span class="section-title">👥 All Players & Balance</span>
    <table>
        <thead><tr><th>NAME</th><th>PHONE</th><th>BALANCE</th><th>UPDATE</th></tr></thead>
        <tbody id="user-list"></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-s-eO1LKw1fUvsVsJDfu23777", // Aapka key wahi purana lagega
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.appspot.com",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e63e41fc2e337"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Load Deposits
    db.ref('requests/deposits').on('value', s => {
        let h = "";
        s.forEach(child => {
            let d = child.val();
            if(d.status === "pending") {
                h += `<tr><td>${d.phone}</td><td>${d.amount}</td><td>${d.method||'EP'}</td><td>${d.tid}</td>
                <td><button class="btn-app" onclick="approveDep('${child.key}','${d.phone}',${d.amount})">✅</button>
                <button class="btn-rej" onclick="db.ref('requests/deposits/${child.key}').update({status:'rejected'})">❌</button></td></tr>`;
            }
        });
        document.getElementById('dep-list').innerHTML = h;
    });

    // 2. Load Withdrawals
    db.ref('requests/withdrawals').on('value', s => {
        let h = "";
        s.forEach(child => {
            let d = child.val();
            if(d.status === "pending") {
                h += `<tr><td>${d.phone}</td><td>${d.amount}</td><td>${d.method||'EP'}</td><td>${d.target||d.targetNumber}</td>
                <td><button class="btn-app" onclick="db.ref('requests/withdrawals/${child.key}').update({status:'approved'})">✅</button>
                <button class="btn-rej" onclick="db.ref('requests/withdrawals/${child.key}').update({status:'rejected'})">❌</button></td></tr>`;
            }
        });
        document.getElementById('wit-list').innerHTML = h;
    });

    // 3. Load ALL Users (FIXED)
    db.ref('users').on('value', s => {
        let h = "";
        if (!s.exists()) { h = "<tr><td colspan='4'>No Users Found</td></tr>"; }
        s.forEach(child => {
            let u = child.val();
            let phone = child.key; // Phone number as key
            h += `<tr>
                <td>${u.username || 'No Name'}</td>
                <td>${phone}</td>
                <td style="color:#27ae60; font-weight:bold;">${u.balance ? u.balance.toFixed(2) : '0.00'}</td>
                <td>
                    <input type="number" id="inp-${phone}" placeholder="+/-">
                    <button class="add-btn" onclick="updateUserBal('${phone}')">GO</button>
                </td>
            </tr>`;
        });
        document.getElementById('user-list').innerHTML = h;
    });

    function approveDep(key, phone, amt) {
        db.ref('users/' + phone + '/balance').transaction(current => (current || 0) + parseFloat(amt));
        db.ref('requests/deposits/' + key).update({ status: "approved" });
        alert("Deposit Approved!");
    }

    function updateUserBal(phone) {
        let val = document.getElementById('inp-' + phone).value;
        if(!val) return;
        db.ref('users/' + phone + '/balance').transaction(current => (current || 0) + parseFloat(val));
        document.getElementById('inp-' + phone).value = "";
        alert("Balance Updated!");
    }
</script>
</body>
</html>
