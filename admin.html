<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - ADMIN PANEL</title>
    <style>
        body { background: #0a0a0a; color: #f1c40f; font-family: sans-serif; padding: 10px; }
        h1 { text-align: center; border-bottom: 2px solid #f1c40f; padding-bottom: 10px; font-size: 18px; }
        .section { background: #111; padding: 10px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .section-title { font-weight: bold; margin-bottom: 10px; display: block; color: #fff; border-left: 4px solid #f1c40f; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; color: #ccc; }
        th, td { border: 1px solid #222; padding: 8px; text-align: left; }
        th { background: #1a1a1a; color: #f1c40f; }
        .btn-app { background: #27ae60; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer; font-size: 9px; }
        .btn-rej { background: #e74c3c; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer; font-size: 9px; margin-left: 2px; }
        input[type="number"] { background: #000; border: 1px solid #444; color: #fff; width: 60px; padding: 3px; border-radius: 3px; }
    </style>
</head>
<body>

<h1>777 ULTRA - ADMIN PANEL</h1>

<div class="section">
    <span class="section-title">🎂 Pending Deposits</span>
    <table>
        <thead>
            <tr>
                <th>USER PHONE</th>
                <th>AMOUNT</th>
                <th>METHOD</th>
                <th>TID</th>
                <th>ACTION</th>
            </tr>
        </thead>
        <tbody id="dep-list"></tbody>
    </table>
</div>

<div class="section">
    <span class="section-title">🎂 Pending Withdrawals</span>
    <table>
        <thead>
            <tr>
                <th>USER PHONE</th>
                <th>AMOUNT</th>
                <th>METHOD</th>
                <th>TARGET</th>
                <th>ACTION</th>
            </tr>
        </thead>
        <tbody id="wit-list"></tbody>
    </table>
</div>

<div class="section">
    <span class="section-title">👥 All Players & Balance Management</span>
    <table>
        <thead>
            <tr>
                <th>USERNAME</th>
                <th>PHONE</th>
                <th>BALANCE</th>
                <th>UPDATE</th>
            </tr>
        </thead>
        <tbody id="user-list"></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-s-eO1LKw1fUvsVsJDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.appspot.com",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e63e41fc2e337"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Load Deposits
    db.ref('requests/deposits').on('value', s => {
        let h = "";
        s.forEach(child => {
            let d = child.val();
            if(d.status === "pending") {
                h += `<tr>
                    <td>${d.phone}</td>
                    <td>PKR ${d.amount}</td>
                    <td>${d.method || 'N/A'}</td>
                    <td style="color:#f1c40f">${d.tid}</td>
                    <td>
                        <button class="btn-app" onclick="approveDep('${child.key}', '${d.phone}', ${d.amount})">APPROVE</button>
                        <button class="btn-rej" onclick="rejectReq('deposits', '${child.key}')">REJECT</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById('dep-list').innerHTML = h;
    });

    // Load Withdrawals
    db.ref('requests/withdrawals').on('value', s => {
        let h = "";
        s.forEach(child => {
            let d = child.val();
            if(d.status === "pending") {
                h += `<tr>
                    <td>${d.phone}</td>
                    <td>PKR ${d.amount}</td>
                    <td>${d.method || 'N/A'}</td>
                    <td>${d.target || d.targetNumber}</td>
                    <td>
                        <button class="btn-app" onclick="approveWit('${child.key}')">DONE</button>
                        <button class="btn-rej" onclick="rejectReq('withdrawals', '${child.key}')">CANCEL</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById('wit-list').innerHTML = h;
    });

    // Load All Users
    db.ref('users').on('value', s => {
        let h = "";
        s.forEach(child => {
            let u = child.val();
            h += `<tr>
                <td>${u.username}</td>
                <td>${u.phone}</td>
                <td id="bal-${u.phone}">${u.balance.toFixed(2)}</td>
                <td>
                    <input type="number" id="inp-${u.phone}" placeholder="Amt">
                    <button class="btn-app" onclick="addBal('${u.phone}')">+</button>
                </td>
            </tr>`;
        });
        document.getElementById('user-list').innerHTML = h;
    });

    function approveDep(key, phone, amt) {
        db.ref('users/' + phone).once('value', s => {
            let newBal = s.val().balance + parseFloat(amt);
            db.ref('users/' + phone).update({ balance: newBal });
            db.ref('requests/deposits/' + key).update({ status: "approved" });
        });
    }

    function approveWit(key) {
        db.ref('requests/withdrawals/' + key).update({ status: "approved" });
    }

    function rejectReq(path, key) {
        db.ref(`requests/${path}/${key}`).update({ status: "rejected" });
    }

    function addBal(phone) {
        let amt = document.getElementById('inp-' + phone).value;
        if(!amt) return;
        db.ref('users/' + phone).once('value', s => {
            let newBal = s.val().balance + parseFloat(amt);
            db.ref('users/' + phone).update({ balance: newBal });
            alert("Balance Updated!");
        });
    }
</script>
</body>
</html>
