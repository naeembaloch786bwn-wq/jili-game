<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777 ULTRA - ADMIN PANEL</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; }
        h1 { color: #f1c40f; text-align: center; border-bottom: 2px solid #f1c40f; padding-bottom: 10px; }
        .section { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        h2 { color: #58a6ff; font-size: 18px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #111; color: #f1c40f; }
        .btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-approve { background: #27ae60; color: white; }
        .btn-reject { background: #c0392b; color: white; margin-left: 5px; }
        .btn-edit { background: #f39c12; color: black; }
        input { background: #000; border: 1px solid #444; color: white; padding: 5px; width: 60px; border-radius: 3px; }
    </style>
</head>
<body>

    <h1>777 ULTRA ADMIN</h1>

    <div class="section">
        <h2>📥 Pending Deposits</h2>
        <table id="deposit-table">
            <thead>
                <tr>
                    <th>Phone</th>
                    <th>Amount</th>
                    <th>TID</th>
                    <th>Method</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dep-list"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>📤 Pending Withdrawals</h2>
        <table id="withdraw-table">
            <thead>
                <tr>
                    <th>Phone</th>
                    <th>Amount</th>
                    <th>Target No</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="wit-list"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>👥 All Players</h2>
        <table id="users-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Balance</th>
                    <th>Edit Bal</th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDTNneivrTLe-s-eO1LKw1fUvsVsJDfu2k",
            authDomain: "pattipro-c1ffe.firebaseapp.com",
            databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
            projectId: "pattipro-c1ffe",
            storageBucket: "pattipro-c1ffe.appspot.com",
            messagingSenderId: "766843054614",
            appId: "1:766843054614:web:781658832e63e41fc2e337"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- FETCH DEPOSITS ---
        db.ref('requests/deposits').on('value', (snap) => {
            let html = "";
            snap.forEach((child) => {
                let req = child.val();
                html += `<tr>
                    <td>${req.phone}</td>
                    <td>${req.amount}</td>
                    <td>${req.tid}</td>
                    <td>${req.method}</td>
                    <td>
                        <button class="btn btn-approve" onclick="approveDeposit('${child.key}', '${req.phone}', ${req.amount})">Approve</button>
                        <button class="btn btn-reject" onclick="deleteRequest('deposits', '${child.key}')">X</button>
                    </td>
                </tr>`;
            });
            document.getElementById('dep-list').innerHTML = html;
        });

        // --- FETCH WITHDRAWALS ---
        db.ref('requests/withdrawals').on('value', (snap) => {
            let html = "";
            snap.forEach((child) => {
                let req = child.val();
                html += `<tr>
                    <td>${req.phone}</td>
                    <td>${req.amount}</td>
                    <td>${req.target}</td>
                    <td>
                        <button class="btn btn-approve" onclick="deleteRequest('withdrawals', '${child.key}')">Done</button>
                        <button class="btn btn-reject" onclick="rejectWithdraw('${child.key}', '${req.phone}', ${req.amount})">Reject</button>
                    </td>
                </tr>`;
            });
            document.getElementById('wit-list').innerHTML = html;
        });

        // --- FETCH ALL USERS ---
        db.ref('users').on('value', (snap) => {
            let html = "";
            snap.forEach((child) => {
                let u = child.val();
                html += `<tr>
                    <td>${u.username}</td>
                    <td>${u.phone}</td>
                    <td>Rs. ${u.balance}</td>
                    <td>
                        <input type="number" id="newbal-${u.phone}" placeholder="Amt">
                        <button class="btn btn-edit" onclick="updateBal('${u.phone}')">Set</button>
                    </td>
                </tr>`;
            });
            document.getElementById('user-list').innerHTML = html;
        });

        // --- ACTIONS ---
        function approveDeposit(key, phone, amt) {
            db.ref('users/' + phone + '/balance').transaction((current) => (current || 0) + amt);
            db.ref('requests/deposits/' + key).remove();
            alert("Deposit Approved!");
        }

        function rejectWithdraw(key, phone, amt) {
            db.ref('users/' + phone + '/balance').transaction((current) => (current || 0) + amt);
            db.ref('requests/withdrawals/' + key).remove();
            alert("Withdraw Rejected & Money Returned!");
        }

        function deleteRequest(type, key) {
            db.ref('requests/' + type + '/' + key).remove();
        }

        function updateBal(phone) {
            let val = parseFloat(document.getElementById('newbal-' + phone).value);
            if(!isNaN(val)) {
                db.ref('users/' + phone).update({ balance: val });
                alert("Balance Updated!");
            }
        }
    </script>
</body>
</html>
