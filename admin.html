<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-approve { background: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .btn-reject { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .status-pending { color: orange; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Naye Khiladi (New Players)</h2>
    <table id="playersTable">
        <thead>
            <tr>
                <th>Naam</th>
                <th>Email/Phone</th>
                <th>Balance</th>
                <th>Join Date</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <h2>Deposit Requests</h2>
    <table id="depositTable">
        <thead>
            <tr>
                <th>Player ID</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Withdrawal Requests</h2>
    <table id="withdrawTable">
        <thead>
            <tr>
                <th>Player ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<script>
    // Firebase Configuration (Apne Firebase console se copy karein)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Naye Players ko Real-time Load karna
    db.ref('users').on('value', (snapshot) => {
        const tbody = document.querySelector("#playersTable tbody");
        tbody.innerHTML = "";
        snapshot.forEach((childSnapshot) => {
            const user = childSnapshot.val();
            tbody.innerHTML += `
                <tr>
                    <td>${user.username}</td>
                    <td>${user.email || user.phone}</td>
                    <td>Rs. ${user.balance}</td>
                    <td>${user.joinDate || 'N/A'}</td>
                </tr>`;
        });
    });

    // 2. Deposit Requests Handle karna
    db.ref('deposits').on('value', (snapshot) => {
        const tbody = document.querySelector("#depositTable tbody");
        tbody.innerHTML = "";
        snapshot.forEach((child) => {
            const dep = child.val();
            if(dep.status === "pending") {
                tbody.innerHTML += `
                <tr>
                    <td>${dep.userId}</td>
                    <td>${dep.amount}</td>
                    <td>${dep.method}</td>
                    <td>
                        <button class="btn-approve" onclick="approveDep('${child.key}', '${dep.userId}', ${dep.amount})">Approve</button>
                        <button class="btn-reject" onclick="rejectReq('deposits', '${child.key}')">Reject</button>
                    </td>
                </tr>`;
            }
        });
    });

    // Approve Function (Balance update karne ke liye)
    function approveDep(key, userId, amount) {
        // Balance barhana
        db.ref('users/' + userId + '/balance').transaction((current) => (current || 0) + amount);
        // Status update karna
        db.ref('deposits/' + key).update({ status: "approved" });
        alert("Deposit Approved!");
    }

    function rejectReq(path, key) {
        db.ref(path + '/' + key).update({ status: "rejected" });
    }
</script>

</body>
</html>
