<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3PattiPro - Admin Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        body { background: #0b0e11; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { height: 100vh; background: #151a21; position: fixed; width: 200px; padding: 20px; border-right: 2px solid #2b3139; }
        .main { margin-left: 220px; padding: 25px; }
        .card-box { background: #1e2329; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2b3139; }
        .stat-val { font-size: 24px; font-weight: bold; color: #f0b90b; }
        .table-dark { background: #1e2329; }
        .btn-action { padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

<div class="sidebar d-none d-md-block">
    <h3 style="color: #f0b90b;">3PattiPro</h3>
    <hr>
    <nav class="nav flex-column">
        <a class="nav-link text-white" href="#users">Players</a>
        <a class="nav-link text-white" href="#deposits">Deposits</a>
        <a class="nav-link text-white" href="#withdraws">Withdrawals</a>
    </nav>
</div>

<div class="main">
    <div class="row text-center">
        <div class="col-md-4"><div class="card-box"><h6>Total Players</h6><div id="count-users" class="stat-val">0</div></div></div>
        <div class="col-md-4"><div class="card-box"><h6>Pending Deposits</h6><div id="count-deposits" class="stat-val">0</div></div></div>
        <div class="col-md-4"><div class="card-box"><h6>Withdraw Requests</h6><div id="count-withdraws" class="stat-val">0</div></div></div>
    </div>

    <div id="users" class="card-box mt-3">
        <h5 style="color: #f0b90b;">New Registered Players</h5>
        <div class="table-responsive">
            <table class="table table-dark table-striped mt-3">
                <thead><tr><th>Phone</th><th>Name</th><th>Balance</th><th>Reg. Date</th></tr></thead>
                <tbody id="user-body"></tbody>
            </table>
        </div>
    </div>

    <div id="deposits" class="card-box mt-4">
        <h5 class="text-success">Live Deposit Requests</h5>
        <table class="table table-dark">
            <thead><tr><th>Phone</th><th>Amount</th><th>Method</th><th>TRX/Number</th><th>Action</th></tr></thead>
            <tbody id="deposit-body"></tbody>
        </table>
    </div>

    <div id="withdraws" class="card-box mt-4">
        <h5 class="text-danger">Withdrawal Requests</h5>
        <table class="table table-dark">
            <thead><tr><th>Phone</th><th>Amount</th><th>Method</th><th>Account</th><th>Action</th></tr></thead>
            <tbody id="withdraw-body"></tbody>
        </table>
    </div>
</div>

<script>
    // --- Firebase Config (Fixed from your Screenshot) ---
    const firebaseConfig = {
        apiKey: "AIzaSyDTNneivrTLe-s-e0lLKw1fUixVSjDfu2k",
        authDomain: "pattipro-c1ffe.firebaseapp.com",
        databaseURL: "https://pattipro-c1ffe-default-rtdb.firebaseio.com",
        projectId: "pattipro-c1ffe",
        storageBucket: "pattipro-c1ffe.firebasestorage.app",
        messagingSenderId: "766843054614",
        appId: "1:766843054614:web:781658832e63e41fc2e337"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Load All Users
    db.ref('users').on('value', (snap) => {
        let users = snap.val();
        let html = ""; let count = 0;
        for(let key in users) {
            count++;
            html += `<tr><td>${users[key].phone || key}</td><td>${users[key].name || 'Player'}</td><td class="text-warning">Rs. ${users[key].balance || 0}</td><td>${users[key].regDate || '-'}</td></tr>`;
        }
        document.getElementById('user-body').innerHTML = html;
        document.getElementById('count-users').innerText = count;
    });

    // 2. Load Deposits (Pending Only)
    db.ref('deposits').orderByChild('status').equalTo('pending').on('value', (snap) => {
        let deps = snap.val();
        let html = ""; let count = 0;
        for(let key in deps) {
            count++;
            html += `<tr><td>${deps[key].phone}</td><td>${deps[key].amount}</td><td>${deps[key].method}</td><td>${deps[key].trxId || deps[key].sender}</td>
            <td><button class="btn btn-success btn-action" onclick="approveDep('${key}', '${deps[key].phone}', ${deps[key].amount})">Approve</button></td></tr>`;
        }
        document.getElementById('deposit-body').innerHTML = html;
        document.getElementById('count-deposits').innerText = count;
    });

    // 3. Load Withdraws (Pending Only)
    db.ref('withdrawals').orderByChild('status').equalTo('pending').on('value', (snap) => {
        let withs = snap.val();
        let html = ""; let count = 0;
        for(let key in withs) {
            count++;
            html += `<tr><td>${withs[key].phone}</td><td>${withs[key].amount}</td><td>${withs[key].method}</td><td>${withs[key].accountNumber}</td>
            <td><button class="btn btn-danger btn-action" onclick="doneWith('${key}')">Mark Paid</button></td></tr>`;
        }
        document.getElementById('withdraw-body').innerHTML = html;
        document.getElementById('count-withdraws').innerText = count;
    });

    // --- Actions Functions ---
    function approveDep(depId, userPhone, amount) {
        // Update User Balance
        db.ref('users/' + userPhone).child('balance').transaction((curr) => (curr || 0) + amount);
        // Set Deposit to Approved
        db.ref('deposits/' + depId).update({ status: 'approved' });
        alert("Success! Balance Updated.");
    }

    function doneWith(withId) {
        db.ref('withdrawals/' + withId).update({ status: 'completed' });
        alert("Marked as Paid!");
    }
</script>
</body>
</html>
