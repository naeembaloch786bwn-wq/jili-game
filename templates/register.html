<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JILI Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0c0f12; color: white; padding: 30px 15px; text-align: center; }
        .card { background: #161a22; padding: 25px; max-width: 360px; margin: auto; border-radius: 12px; border: 1px solid #252c3a; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; background: #252c3a; color: white; border: 1px solid #444; border-radius: 6px; }
        button { width: 97%; padding: 12px; background: #28a745; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 Create Account</h2>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Mobile Number" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <input type="password" name="withdraw_pin" placeholder="Withdrawal Security PIN (4 Digits)" required><br>
            <button type="submit">Register & Login</button>
        </form>
        <p style="font-size:13px; margin-top:15px;">Pehle se account hai? <a href="/login" style="color:#28a745; text-decoration:none;">Login Karein</a></p>
    </div>
</body>
</html>
