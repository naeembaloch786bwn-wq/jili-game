<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JILI Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0c0f12; color: white; padding: 30px 15px; text-align: center; }
        .card { background: #161a22; padding: 25px; max-width: 360px; margin: auto; border-radius: 12px; border: 1px solid #252c3a; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; background: #252c3a; color: white; border: 1px solid #444; border-radius: 6px; }
        button { width: 97%; padding: 12px; background: #ffcc00; color: black; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Login JILI</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Mobile Number (e.g. 923001234567)" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p style="font-size:13px; margin-top:15px;">Account nahi hai? <a href="/register" style="color:#ffcc00; text-decoration:none;">Register Karein</a></p>
    </div>
</body>
</html>
